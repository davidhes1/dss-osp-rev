:root {
  --bg: #F4F6FA; --surface: #FFFFFF; --surface2: #EBEFF7; --ink: #0E1B35; --muted: #52607C; --line: #CFD7E6;
  --accent: #2457D6; --accent-tint: #E3EBFF; --hl: #FFE45C; --hl-ink: #3A2F00;
  --red: #C8222F; --red-tint: #FDE8EA; --green: #11784F; --green-tint: #E1F5EC; --amber: #A25F00; --amber-tint: #FFF1D6;
  --a1: #2457D6; --a2: #0B8480; --a3: #8240BE; --a4: #BE3F08; --a5: #876300; --a6: #B8226A; --a7: #2B7530; --a8: #B8242C;
  --f-head: 'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --c1: #D3E2FF; --c2: #C9F2EB; --c3: #E6D8FF; --c4: #FFDCC6; --c5: #FFEFAD; --c6: #FFD3E6; --c7: #CDF3CB; --c1s: #2457D6; --c2s: #0B8480; --c3s: #7C3AED; --c4s: #E2560B; --c5s: #B98C00; --c6s: #D6246E; --c7s: #2E9E44;
  --r1: #C2F0D3; --r2: #FFEC99; --r3: #FFC999; --r4: #FFB3B3; --r1s: #2E9E44; --r2s: #B98C00; --r3s: #E2560B; --r4s: #DC2626;
  --line-d: #0E1B35; --on-hue: #FFFFFF;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1222; --surface: #151D33; --surface2: #1D2742; --ink: #E9EEFB; --muted: #A2AECB; --line: #2E3A5C;
    --accent: #7FA3FF; --accent-tint: #1B2A55; --hl: #FFE45C; --hl-ink: #3A2F00;
    --red: #FF7C86; --red-tint: #3B1B22; --green: #5FD6A2; --green-tint: #123428; --amber: #FFC165; --amber-tint: #382A10;
    --a1: #7FA3FF; --a2: #4CD0CB; --a3: #C197F2; --a4: #FF9A63; --a5: #E8C14A; --a6: #F27DB2; --a7: #7FD083; --a8: #FF8A90;
    --c1: #1D4FD8; --c2: #0B6E67; --c3: #6D32D9; --c4: #B23A0A; --c5: #8F5605; --c6: #BE185D; --c7: #13712F; --c1s: #A5C2FF; --c2s: #7CEBDD; --c3s: #CDBDFF; --c4s: #FFC08A; --c5s: #FDE68A; --c6s: #FBB0D5; --c7s: #95F0B2;
    --r1: #13712F; --r2: #8F5605; --r3: #B23A0A; --r4: #B91C1C; --r1s: #95F0B2; --r2s: #FDE68A; --r3s: #FFC08A; --r4s: #FCA5A5;
    --line-d: #E9EEFB; --on-hue: #0C1222;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1222; --surface: #151D33; --surface2: #1D2742; --ink: #E9EEFB; --muted: #A2AECB; --line: #2E3A5C;
  --accent: #7FA3FF; --accent-tint: #1B2A55; --hl: #FFE45C; --hl-ink: #3A2F00;
  --red: #FF7C86; --red-tint: #3B1B22; --green: #5FD6A2; --green-tint: #123428; --amber: #FFC165; --amber-tint: #382A10;
  --a1: #7FA3FF; --a2: #4CD0CB; --a3: #C197F2; --a4: #FF9A63; --a5: #E8C14A; --a6: #F27DB2; --a7: #7FD083; --a8: #FF8A90;
  --c1: #1D4FD8; --c2: #0B6E67; --c3: #6D32D9; --c4: #B23A0A; --c5: #8F5605; --c6: #BE185D; --c7: #13712F; --c1s: #A5C2FF; --c2s: #7CEBDD; --c3s: #CDBDFF; --c4s: #FFC08A; --c5s: #FDE68A; --c6s: #FBB0D5; --c7s: #95F0B2;
  --r1: #13712F; --r2: #8F5605; --r3: #B23A0A; --r4: #B91C1C; --r1s: #95F0B2; --r2s: #FDE68A; --r3s: #FFC08A; --r4s: #FCA5A5;
  --line-d: #E9EEFB; --on-hue: #0C1222;
  color-scheme: dark;
}
html { height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--f-body); -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.15; margin: 0 0 .5em; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 7vw, 2.9rem); font-weight: 800; }
h2 { font-size: 1.45rem; font-weight: 700; margin-top: 1.6em; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px 56px; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.pre { white-space: pre-wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 2px solid var(--ink); }
.topbar .in { max-width: 780px; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding: 6px 12px; }
.brand { font-family: var(--f-head); font-weight: 800; font-size: .95rem; color: var(--ink); text-decoration: none; margin-right: auto; white-space: nowrap; }
.nav { display: flex; gap: 2px; }
.nav a { color: var(--ink); text-decoration: none; padding: 8px 6px; border-radius: 6px; font-weight: 700; font-size: .9rem; min-height: 44px; display: inline-flex; align-items: center; }
.nav a[aria-current="page"] { background: var(--hl); color: var(--hl-ink); }
.nav a:hover { background: var(--surface2); }
.nav a[aria-current="page"]:hover { background: var(--hl); }

/* crumbs and headings */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 18px 0 6px; font-size: .95rem; }
.crumbs a { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border: 2px solid var(--ink); border-radius: 99px; font-size: .85rem; font-weight: 700; background: var(--surface); }
.chip.hue { border-color: var(--hue); color: var(--hue); }
.chip.green { border-color: var(--green); color: var(--green); background: var(--green-tint); }
.chip.amber { border-color: var(--amber); color: var(--amber); background: var(--amber-tint); }
.chip.red { border-color: var(--red); color: var(--red); background: var(--red-tint); }

/* hero */
.hero { padding: 26px 0 10px; }
.hero p { max-width: 34em; font-size: 1.1rem; color: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.count { border: 2px solid var(--ink); background: var(--surface); border-radius: 8px; padding: 8px 14px; display: flex; flex-direction: column; min-width: 150px; }
.count b { font-family: var(--f-head); font-size: 1.7rem; line-height: 1.1; }
.count span { font-size: .9rem; color: var(--muted); }

/* paper panels and mark bar */
.paper { border: 2px solid var(--ink); background: var(--surface); border-radius: 8px; padding: 16px; margin: 16px 0; }
.paper header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.paper header h2 { margin: 0; font-size: 1.5rem; }
.markbar { display: flex; gap: 4px; height: 70px; margin: 10px 0 14px; }
.seg { --n: 1; flex: var(--n) 1 0; min-width: 34px; position: relative; border: 2px solid var(--hue); border-radius: 6px; background: var(--surface2); overflow: hidden; text-decoration: none; display: block; }
.seg .fill { position: absolute; left: 0; right: 0; bottom: 0; height: var(--p, 0%); background: var(--hue); opacity: .85; transition: height .5s; }
.seg .n { position: absolute; top: 5px; left: 5px; min-width: 24px; height: 24px; display: grid; place-items: center; background: var(--surface); color: var(--ink); border: 2px solid var(--hue); border-radius: 5px; font-family: var(--f-head); font-weight: 800; font-size: .95rem; padding: 0 4px; }
.seg:hover { transform: translateY(-2px); }
.arealist { list-style: none; margin: 0; padding: 0; }
.arealist li a { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); min-height: 48px; }
.arealist .dot { width: 14px; height: 14px; border-radius: 4px; background: var(--hue); flex: none; }
.arealist .nm { flex: 1; font-weight: 700; }
.arealist .pc { font-variant-numeric: tabular-nums; color: var(--muted); }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 8px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.hl { background: var(--hl); color: var(--hl-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: .95rem; }

/* action tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 16px 0; }
.tile { display: block; text-decoration: none; color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; padding: 14px; background: var(--surface); }
.tile b { display: block; font-family: var(--f-head); font-size: 1.15rem; margin-bottom: 2px; }
.tile span { color: var(--muted); font-size: .95rem; }
.tile:hover { background: var(--hl); color: var(--hl-ink); }
.tile:hover span { color: var(--hl-ink); }

/* search */
.search { width: 100%; min-height: 50px; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
.results { list-style: none; margin: 8px 0 0; padding: 0; }
.results a { display: flex; gap: 10px; padding: 10px 4px; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); min-height: 46px; align-items: center; }
.tid { font-family: var(--f-head); font-weight: 800; min-width: 3.2em; color: var(--hue, var(--accent)); }

/* topic rows */
.toplist { list-style: none; margin: 10px 0; padding: 0; }

/* tabs */

/* organiser */

.diagram { width: 100%; max-width: 420px; height: auto; }

/* quiz */

.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 12px 14px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 54px; }
.opt .k { flex: none; width: 28px; height: 28px; border: 2px solid var(--ink); border-radius: 6px; display: grid; place-items: center; font-weight: 800; font-size: .9rem; background: var(--surface); }

.opt.right { border-color: var(--green); background: var(--green-tint); }
.opt.wrong { border-color: var(--red); background: var(--red-tint); }

.slots { list-style: none; margin: 0 0 12px; padding: 0; counter-reset: s; display: grid; gap: 8px; }

.a1 { --hue: var(--a1); } .a2 { --hue: var(--a2); } .a3 { --hue: var(--a3); } .a4 { --hue: var(--a4); }
.a5 { --hue: var(--a5); } .a6 { --hue: var(--a6); } .a7 { --hue: var(--a7); } .a8 { --hue: var(--a8); }

.d-box.c5 { fill: var(--c5); stroke: var(--c5s); } .d-box.c6 { fill: var(--c6); stroke: var(--c6s); } .d-box.c7 { fill: var(--c7); stroke: var(--c7s); }

.fcard { background: var(--surface); border: 3px solid var(--hue, var(--ink)); border-radius: 18px; padding: 22px 18px; min-height: 230px; display: flex; flex-direction: column; justify-content: center; gap: 12px; margin: 10px 0; box-shadow: 0 6px 0 var(--hue, var(--ink)); }

.fct { font-size: .9rem; font-weight: 700; color: var(--muted); }

.fterm { font-family: var(--f-head); font-size: clamp(1.6rem, 7vw, 2.3rem); font-weight: 800; line-height: 1.15; }
.fdef { font-size: 1.15rem; line-height: 1.5; }
.fin { animation: flipin .28s ease-out; }
@keyframes flipin { from { transform: perspective(800px) rotateY(-70deg); opacity: .3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .fin { animation: none; } }
.btn.fc-no { background: var(--red-tint); border-color: var(--red); color: var(--red); flex: 1; }
.btn.fc-yes { background: var(--green); border-color: var(--green); color: var(--bg); flex: 1; }
/* planner */
.plist { list-style: none; margin: 10px 0; padding: 0; }
.ptask { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; margin-bottom: 8px; border: 2px solid var(--line); border-left: 6px solid var(--hue, var(--accent)); border-radius: 10px; background: var(--surface); }
.ptask.done { border-color: var(--green); background: var(--green-tint); }
.pchk { display: flex; gap: 12px; align-items: flex-start; flex: 1 1 220px; cursor: pointer; }
.pchk input { width: 26px; height: 26px; margin-top: 2px; accent-color: var(--green); flex: none; }
.pchk > span { display: flex; flex-direction: column; }
.pact { display: flex; gap: 6px; flex-wrap: wrap; }
.week { display: flex; gap: 6px; margin: 8px 0; }
.dd { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; border: 2px solid var(--line); background: var(--surface); }
.dd.on { background: var(--green); border-color: var(--green); color: var(--bg); }
.dd.now { outline: 3px solid var(--accent); outline-offset: 2px; }
.road { list-style: none; padding: 0 0 0 18px; margin: 10px 0 10px 8px; border-left: 4px solid var(--line); }
.road li { position: relative; padding: 2px 0 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.road li::before { content: ''; position: absolute; left: -29px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); }
.road li.past::before { background: var(--line); }
.road li.now::before { background: var(--accent); border-color: var(--accent); }
.road li.now > b { color: var(--accent); }
.plan-cds .cd { background: var(--surface2); border-color: var(--line); color: var(--ink); }
.plan-cds .cd.mk { border-color: var(--amber); }

/* teacher view */
table.sam.tvt { min-width: 640px; }
.tvt th, .tvt td { text-align: center; }
.tvt td:first-child, .tvt th:first-child { text-align: left; }
.tvt td.hg { background: var(--green-tint); color: var(--green); font-weight: 800; }
.tvt td.ha { background: var(--amber-tint); color: var(--amber); font-weight: 800; }
.tvt td.hr { background: var(--red-tint); color: var(--red); font-weight: 800; }
.tvt td.hn { background: var(--surface2); color: var(--muted); }
.tvt tr.tvavg td { border-top: 2px solid var(--ink); }
#codeout textarea, #backout textarea, #tvcsv { font-family: ui-monospace, Consolas, monospace; font-size: .85rem; word-break: break-all; }

/* exam day guide */
.edps { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
.edp { display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: 14px; background: var(--hue); color: var(--on-hue); }
.edp b { font-family: var(--f-head); font-size: 1.4rem; }
.edctl { grid-template-columns: 1fr 1fr; }

/* home page, version 3 */
.hero3 { padding-bottom: 22px; }
.hero-net { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hero-top h1 { margin: 2px 0 4px; }
.hero-illo { flex: none; width: clamp(104px, 30vw, 200px); }
.hero-illo svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 10px rgba(20, 10, 60, .28)); animation: illofloat 6s ease-in-out infinite; }
@keyframes illofloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.today { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.tchip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border-radius: 99px; background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .38); color: #fff; text-decoration: none; font-size: .92rem; }
.tchip:hover { background: rgba(255, 255, 255, .3); }
.tchip b { font-weight: 800; }
.cdbar { display: block; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .22); margin-top: 8px; overflow: hidden; }
.cdbar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ffe45c, #fff); }
.st2 { text-decoration: none; color: inherit; position: relative; padding-top: 48px; transition: border-color .15s; }
.st2 .sti { position: absolute; top: 12px; left: 12px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--hue); color: var(--on-hue); }
.st2:hover { border-color: var(--hue); }
.atile::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .07) 0 10px, transparent 10px 20px); pointer-events: none; }
.atile .bgi { position: absolute; right: -12px; bottom: -16px; opacity: .14; pointer-events: none; }
.atile .ai, .atile b, .atile .meta { position: relative; }
.home h2.deco::after, .home .phead h2::after { content: ''; display: block; width: 52px; height: 5px; border-radius: 3px; margin-top: 6px; background: linear-gradient(90deg, #5a2bc2, #b4237a); }
@media (prefers-reduced-motion: reduce) { .hero-illo svg { animation: none; } }
.home .statrow { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
@media (max-width: 420px) { .home .statrow { grid-template-columns: 1fr 1fr; } }

/* common mistakes */
.mist { list-style: none; padding: 0; margin: 8px 0 14px; }
.mist li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin-bottom: 8px; border-radius: 10px; background: var(--red-tint); border-left: 5px solid var(--red); }
.mist .mx { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--red); color: var(--bg); margin-top: 1px; }
.mist li > div { display: flex; flex-direction: column; gap: 6px; }
.mist .fx { display: flex; gap: 8px; align-items: flex-start; color: var(--ink); }
.mist .mk { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: var(--bg); }

.d-dot { fill: var(--line-d); }

/* teacher stamps */
.stampbox { display: flex; align-items: center; gap: 14px; margin: 14px 0 6px; padding: 10px 12px; border-radius: 14px; background: var(--surface2); }
.stampbox.ok { border: 2px solid var(--green); }
.stampbox.fail { border: 2px solid var(--line); }
.stamp { flex: none; width: 110px; height: 110px; transform: rotate(-8deg); animation: stampin .5s cubic-bezier(.2, 1.5, .4, 1) both; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .25)); }
.stampbox.fail .stamp { width: 92px; height: 92px; }
.stampline { margin: 0 0 6px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; }
@keyframes stampin { 0% { transform: scale(1.9) rotate(-22deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } }

/* reading and display options */
:root { --fs-scale: 1; }
:root[data-fs="l"] { --fs-scale: 1.15; }
:root[data-fs="xl"] { --fs-scale: 1.3; }
html { font-size: calc(100% * var(--fs-scale)); }
body { font-size: calc(17px * var(--fs-scale)); }
.a11y-space body { letter-spacing: .035em; word-spacing: .14em; line-height: 1.85; }
.a11y-space h1, .a11y-space h2, .a11y-space h3 { font-family: var(--f-body); letter-spacing: .01em; }
.a11y-space p, .a11y-space li, .a11y-space dd { max-width: 70ch; }
.a11y-font body, .a11y-font h1, .a11y-font h2, .a11y-font h3, .a11y-font .btn, .a11y-font input, .a11y-font textarea, .a11y-font select, .a11y-font .brand, .a11y-font .fterm, .a11y-font .atile b, .a11y-font .qa b, .a11y-font .cd b, .a11y-font .stat b, .a11y-font .nav a { font-family: Verdana, Tahoma, Arial, sans-serif !important; }

  :root[data-tint="cream"] { --bg: #FAF5E4; --surface: #FFFCF0; --surface2: #F3ECD6; }
  :root[data-tint="blue"] { --bg: #E8F0FB; --surface: #F4F8FE; --surface2: #DCE7F7; }
  :root[data-tint="green"] { --bg: #E8F5EA; --surface: #F4FBF5; --surface2: #DAEEDD; }
}
.a11y-still *, .a11y-still *::before, .a11y-still *::after { animation: none !important; transition: none !important; }
.nav .aa { font-weight: 800; padding: 0 9px; border: 2px solid var(--line); border-radius: 8px; }
/* read aloud and report a problem */
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 6px; padding-top: 12px; border-top: 1px dashed var(--line); }
.tools .btn { display: inline-flex; align-items: center; gap: 6px; }
.tools .report { flex: 1 1 100%; }
.report { margin: 10px 0; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); box-sizing: border-box; }
.rpdiag { display: block; margin: 0 0 8px auto; font-size: .82rem; }
.nav { flex-wrap: wrap; row-gap: 4px; }

/* ===== OSP portal additions ===== */
:root { --a2: #0A7470; } /* the Core teal fell just short of 4.5:1 with white text and on the page background */
.hero-osp { background: radial-gradient(circle at 85% 12%, rgba(255,255,255,.08) 0, transparent 38%), radial-gradient(circle at 8% 110%, rgba(255,228,92,.10) 0, transparent 42%), linear-gradient(135deg, #0e2a5c 0%, #0b4560 52%, #0a4d44 100%); }
.hero-osp .tchip, .hero-osp .cd { background: rgba(255,255,255,.14); }
.hero-osp .cd small { opacity: .92; }
.hero2 a:not(.btn):not(.tchip) { color: #fff; }
.hero-note { margin: 6px 0 0; font-size: .92rem; color: #fff; }
.cd.now { border-color: var(--hl); }
.plan-cds .cd.now { border-color: var(--accent); }
.tgrid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.ttile { min-height: 168px; }
.ttile .tacts { position: relative; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.ttile .tacts span { font-size: .8rem; font-weight: 800; padding: 1px 8px; border-radius: 99px; border: 1.5px solid currentColor; }
.edp.tcard { text-decoration: none; }
.edp.tcard:hover { filter: brightness(1.06); }
/* marks per activity */
.mbars { margin: 10px 0; }
.mbar { display: grid; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mbar .ml a { font-family: var(--f-head); font-weight: 800; color: var(--hue); margin-right: 4px; }
.mbar .mt { display: block; height: 14px; border-radius: 99px; background: var(--surface2); overflow: hidden; border: 1px solid var(--line); }

.mprate { display: flex; align-items: flex-end; gap: 4px; height: 190px; margin: 14px 0 4px; padding: 8px 6px 0; border-bottom: 2px solid var(--ink); background: var(--surface); border-radius: 10px 10px 0 0; }
.mprate span { flex-basis: 0; flex-grow: 1; min-width: 34px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; }
.mprate i { display: block; width: 100%; background: var(--hue); border-radius: 6px 6px 0 0; min-height: 6px; }
.mprate b { font-family: var(--f-head); font-size: .85rem; order: 3; padding: 2px 0 4px; }
.mprate small { font-weight: 800; font-size: .85rem; order: 1; }
.mprate i { order: 2; }
/* band ladders */
.ladder { border: 2px solid var(--line); border-left: 6px solid var(--hue); border-radius: 12px; background: var(--surface); padding: 12px 14px; margin: 12px 0; }
.ladder h3 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
.mkpill { font-family: var(--f-body); font-size: .85rem; font-weight: 700; padding: 1px 10px; border-radius: 99px; background: var(--hue); color: var(--on-hue); }
.bands3 { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.bands3 li { display: grid; grid-template-columns: 7.2em 1fr; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 8px; background: var(--surface2); border: 2px solid transparent; }
.bands3 li.b3 { background: var(--green-tint); border-color: var(--green); }
.bands3 .bn { font-family: var(--f-head); font-weight: 800; display: flex; flex-direction: column; }
.bands3 .bn small { font-family: var(--f-body); font-weight: 700; font-size: .8rem; color: var(--muted); }

@media (max-width: 480px) { .bands3 li { grid-template-columns: 1fr; gap: 2px; } .bands3 .bn { flex-direction: row; flex-wrap: wrap; gap: 0 8px; align-items: baseline; } }
/* pages still being built */
.stubbox { border: 2px dashed var(--line); border-radius: 12px; padding: 4px 14px 2px; margin: 18px 0; background: var(--surface); }
.stubbox h2 { margin-top: .7em; font-size: 1.2rem; }
.stubbox.small p { margin: 10px 0; }
/* spec lists */
.speclist { list-style: none; padding: 0; margin: 8px 0 14px; }
.speclist li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.sid { font-family: var(--f-head); font-weight: 800; min-width: 2.8em; color: var(--hue, var(--muted)); }
.stt { flex: 1 1 200px; }
.uses { display: flex; gap: 5px; flex-wrap: wrap; }
.uchip { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 32px; padding: 2px 9px; border-radius: 99px; border: 2px solid var(--hue); color: var(--hue); font-weight: 800; font-size: .82rem; text-decoration: none; background: var(--surface); }
.uchip:hover { background: var(--hue); color: var(--on-hue); }
/* tables and dates */
table.sam.frows, table.sam.dtbl { min-width: 0; }
.dtbl tr.live td { background: var(--accent-tint); }
.mdates { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.mdates input { width: 100%; min-height: 48px; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
.mdates small { display: block; margin-top: 4px; }
.actlist .sub { display: block; font-size: .9rem; color: var(--muted); }
/* diagram report link sits under the diagram, not beside it (the Core portal squeezed diagrams on phones) */
.diagwrap { flex-wrap: wrap; }
.diagwrap .rpdiag { flex: 0 0 100%; margin: 6px 0 0; text-align: right; }
.brand { min-height: 44px; display: inline-flex; align-items: center; }
.crumbs a { display: inline-flex; align-items: center; min-height: 32px; padding: 0 2px; }
.field select { width: 100%; min-height: 48px; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
@media (max-width: 600px) { .speclist .uses { flex-basis: 100%; padding-left: 3.4em; } }
/* keep content clear of a phone's status bar when the page scrolls under it */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
/* floor plans */
.fp-wall { fill: none; stroke: var(--ink); stroke-width: 3; }
.fp-open { stroke: var(--line-d); stroke-width: 1.5; stroke-dasharray: 4 4; }
.fp-gap { stroke-width: 7; stroke-linecap: butt; }
.fp-door { stroke: var(--c4s); }
.fp-win { stroke: var(--c1s); stroke-dasharray: 3 2; }
.fp-fire { stroke: var(--red); }
/* guides */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; margin: 14px 0 4px; scrollbar-width: thin; }
.tabs a { flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 40px; padding: 6px 14px; border: 2px solid var(--line); border-radius: 99px; text-decoration: none; color: var(--ink); font-weight: 700; background: var(--surface); white-space: nowrap; }
.tabs a[aria-current="page"] { background: var(--hue); color: var(--on-hue); border-color: var(--hue); }
.tabpanel { min-height: 40vh; }
figure.diagwrap { margin: 14px 0; }
figure.diagwrap figcaption { flex: 0 0 100%; font-size: .9rem; color: var(--muted); margin-top: 6px; }
.steps > div { padding: 10px 12px; border-left: 4px solid var(--hue); background: var(--surface); margin: 8px 0; border-radius: 0 8px 8px 0; }
.rcard, .bcard, .lab { border: 2px solid var(--line); border-radius: 12px; background: var(--surface); margin: 12px 0; overflow: hidden; }
.rcard header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--surface2); border-bottom: 2px solid var(--line); }
.rcard header b { font-family: var(--f-head); font-size: 1.1rem; }
.rcard dl, .bcard dl { margin: 0; padding: 8px 12px 10px; display: grid; grid-template-columns: 10.5em 1fr; gap: 6px 12px; }
.rcard dt, .bcard dt { font-weight: 800; }
.rcard dd, .bcard dd { margin: 0; }
@media (max-width: 560px) { .rcard dl, .bcard dl { grid-template-columns: 1fr; gap: 0; } .rcard dd, .bcard dd { margin: 0 0 8px; } }
.lvl-chip { font-weight: 800; font-size: .85rem; padding: 2px 10px; border-radius: 99px; border: 2px solid; color: var(--ink); }
.lv-low { background: var(--r1); border-color: var(--r1s); } .lv-medium { background: var(--r2); border-color: var(--r2s); } .lv-high { background: var(--r3); border-color: var(--r3s); } .lv-critical { background: var(--r4); border-color: var(--r4s); }
.rchips { display: flex; gap: 4px; flex-wrap: wrap; }
.rchip { font-weight: 800; font-size: .8rem; padding: 1px 8px; border-radius: 99px; background: var(--hue); color: var(--on-hue); }
.bcard { border-left-width: 8px; padding: 4px 4px 8px; }
.bcard h3 { margin: 8px 12px 0; }
.bcard > p, .bcard > ul { margin: 6px 12px; }
.bcard.b1 { border-left-color: var(--red); } .bcard.b2 { border-left-color: var(--a5); } .bcard.b3 { border-left-color: var(--green); }
.tline { list-style: none; padding: 0; margin: 10px 0; }
.tline li { display: grid; grid-template-columns: 4.8em 1fr; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tline .tm { grid-row: span 3; font-family: var(--f-head); font-weight: 800; }
.tline i { display: block; height: 8px; border-radius: 99px; background: var(--hue); max-width: 100%; }
.lab { padding: 4px 14px 8px; }
.lab pre { overflow-x: auto; background: var(--surface2); padding: 10px 12px; border-radius: 8px; font-size: .88rem; line-height: 1.5; }
.lab code, .sline code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
.mlist li { margin-bottom: 12px; }
.mlist p { margin: 4px 0; }
.srctag, .lens { display: inline-block; font-size: .78rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; border: 1.5px solid var(--line-d); color: var(--muted); }
.ticks { list-style: none; padding: 0; margin: 10px 0; }
.ticks li { margin: 6px 0; }
.ba { border: 2px solid var(--line); border-radius: 10px; margin: 10px 0; overflow: hidden; }
.ba p { margin: 0; padding: 8px 12px; }
.ba .was { background: var(--red-tint); }
.ba .now { background: var(--green-tint); }
.ba span { display: block; font-weight: 800; font-size: .85rem; }
.pre { white-space: pre-wrap; }
/* practice: spot the error and typed commands */
.spot { display: grid; gap: 6px; margin: 10px 0; }
.sline { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 10px 12px; min-height: 44px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.sline code { font-size: .92rem; overflow-wrap: anywhere; }
.sline .ln { font-weight: 800; min-width: 1.4em; }
.sline[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.sline.right { border-color: var(--green); background: var(--green-tint); }
.sline.wrong { border-color: var(--red); background: var(--red-tint); }
.cmdline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 10px 0; padding: 6px 12px; border: 2px solid var(--ink); border-radius: 8px; background: #0c1222; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
.cmdline:focus-within { outline: 3px solid var(--hl); outline-offset: 2px; }
.cmdline .pr { color: #8fe39a; white-space: nowrap; font-size: .92rem; }
.cmdline input { flex: 1 1 160px; min-width: 0; min-height: 44px; background: transparent; border: 0; color: #fff; font: inherit; font-size: 1rem; outline: none; }
.cmdline input:disabled { color: #fff; opacity: 1; -webkit-text-fill-color: #fff; }
.qtitle { font-size: 1.15rem; margin: 6px 0 4px; }
.tabs { border: 0; border-radius: 0; background: none; }

.rcall { border: 2px solid var(--line); border-radius: 12px; padding: 4px 14px 12px; margin: 12px 0; background: var(--surface); }
.rcall h3 { font-size: 1.05rem; }
.model { border-top: 2px dashed var(--line); margin-top: 10px; padding-top: 6px; }
.rate { display: flex; flex-wrap: wrap; gap: 8px; }
.rate .btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kapply { border: 2px solid var(--line); border-left: 6px solid var(--hue); border-radius: 12px; padding: 4px 14px 8px; margin: 12px 0; background: var(--surface); }

.ckrow { align-items: center !important; }
.rag { display: flex; gap: 4px; flex: 0 0 auto; }
.ragb { min-height: 36px; min-width: 56px; padding: 4px 8px; border-radius: 8px; border: 2px solid var(--line-d); background: var(--surface); color: var(--ink); font: inherit; font-size: .82rem; font-weight: 700; cursor: pointer; }
.ragb.r.on { background: var(--red-tint); border-color: var(--red); }
.ragb.a.on { background: var(--surface2); border-color: var(--a5); }
.ragb.g.on { background: var(--green-tint); border-color: var(--green); }
.ktopics a { flex-wrap: wrap; }
.ktopics .tt { min-width: 0; flex: 1 1 160px; overflow-wrap: anywhere; }
.kmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 10px 0 0; }
/* upgraded diagrams */
.d-ico { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.d-disc { fill: var(--surface); stroke: var(--line-d); stroke-width: 1.5; }
.d-win { fill: var(--surface); stroke: var(--line-d); stroke-width: 2; }
.d-bar { fill: var(--surface2); }
.d-sep { stroke: var(--line-d); stroke-width: 1.5; }
.d-flow { stroke: none; fill-opacity: .5; }
.d-flow.c4 { fill: var(--c4s); } .d-flow.c6 { fill: var(--c6s); } .d-flow.c7 { fill: var(--c7s); }
/* widgets */
.widget { border: 2px solid var(--hue, var(--line)); border-radius: 12px; padding: 6px 14px 10px; margin: 14px 0; background: var(--surface); }
.widget .wt { margin: 6px 0; }
.wrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; }
.wl { min-width: 6.5em; font-weight: 800; }
.wb { min-width: 44px; min-height: 44px; border-radius: 8px; border: 2px solid var(--line-d); background: var(--surface); color: var(--ink); font: inherit; font-weight: 800; cursor: pointer; }
.wb[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.wrow input[type=range] { flex: 1 1 180px; min-height: 44px; accent-color: var(--hue, var(--accent)); }
.wout { font-size: 1.05rem; margin: 8px 0 0; }
/* term links */
.termlink { display: inline; font: inherit; color: inherit; background: none; border: 0; padding: 0; border-bottom: 2px dotted var(--hue, var(--accent)); cursor: pointer; font-weight: 700; }
.termpop { display: block; margin: 6px 0; padding: 8px 12px; border-left: 4px solid var(--hue, var(--accent)); background: var(--surface2); border-radius: 0 8px 8px 0; font-weight: 400; }
/* knowledge prominence */
.kline { position: relative; display: block; margin-top: 8px; font-size: .85rem; font-weight: 700; }
.kbar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); margin: 8px 0 4px; }
.kbar i { display: block; height: 100%; }
.kbar .k1 { background: var(--c4s); } .kbar .k2 { background: var(--c6s); } .kbar .k3 { background: var(--c7s); }
.klegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .88rem; }
.klegend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.klegend .k1::before { background: var(--c4s); } .klegend .k2::before { background: var(--c6s); } .klegend .k3::before { background: var(--c7s); }
table.heat { min-width: 560px; }
table.heat td.h { text-align: center; padding: 0; }
table.heat td.h a { display: block; min-height: 40px; line-height: 40px; text-decoration: none; color: var(--ink); font-weight: 800; }
table.heat td.h2 { background: var(--c1); } table.heat td.h1 { background: var(--surface2); }
table.heat th.tt a { color: var(--ink); }
.spotsigns details { border: 2px solid var(--line); border-radius: 8px; margin: 6px 0; background: var(--surface); } .spotsigns summary { cursor: pointer; padding: 10px 12px; min-height: 44px; font-weight: 700; } .spotsigns details p { margin: 0 12px 10px; }

.catchip { font-size: .8rem; font-weight: 800; padding: 2px 10px; border-radius: 99px; border: 2px solid; color: var(--ink); }
.catchip.cat0 { background: var(--c4); border-color: var(--c4s); } .catchip.cat1 { background: var(--c1); border-color: var(--c1s); } .catchip.cat2 { background: var(--c5); border-color: var(--c5s); }
.clues { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 12px 0; }
.clue { border: 2px solid var(--line); border-top: 6px solid; border-radius: 12px; padding: 4px 14px 6px; background: var(--surface); }
.clue.c4 { border-top-color: var(--c4s); } .clue.c1 { border-top-color: var(--c1s); } .clue.c5 { border-top-color: var(--c5s); }
.clue h3 { font-size: 1.05rem; margin: 8px 0 4px; }
.clue ul { margin: 0 0 6px; padding-left: 1.2em; }
.hcard { border: 2px solid var(--line); border-left: 8px solid; border-radius: 12px; padding: 2px 14px 10px; margin: 14px 0; background: var(--surface); }
.hcard.c4 { border-left-color: var(--c4s); } .hcard.c1 { border-left-color: var(--c1s); } .hcard.c7 { border-left-color: var(--c7s); } .hcard.c6 { border-left-color: var(--c6s); } .hcard.c5 { border-left-color: var(--c5s); }
.hcard h2 { font-size: 1.2rem; margin-top: .7em; }
.vsteps li { margin: 8px 0; }
table.sam.logt { min-width: 640px; }
/* project page tiles */
.pgrid { grid-template-columns: 1fr; }
.tshare { position: relative; display: block; height: 10px; border-radius: 99px; background: rgba(255, 255, 255, .35); margin-top: 10px; overflow: hidden; }
.tshare i { display: block; height: 100%; background: currentColor; border-radius: inherit; }
.d-box.c0 { fill: var(--surface); stroke: var(--line-d); }
/* tracker, assessment days, flashcards */
.mockt { border: 2px solid var(--line); border-left: 6px solid var(--hue); border-radius: 12px; padding: 2px 14px 10px; margin: 14px 0; background: var(--surface); }
.mrow { display: grid; grid-template-columns: 1fr auto 4.5em; gap: 4px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mrow select { min-height: 44px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; padding: 4px 8px; }
.mrow .mb { font-weight: 800; }
.mrow .mt { grid-column: 1 / -1; display: block; height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.mrow .mt i { display: block; height: 100%; background: var(--hue); }
@media (max-width: 480px) { .mrow { grid-template-columns: 1fr auto; } .mrow .ml { grid-column: 1 / -1; } }
.splan { border: 2px solid var(--line); border-left: 6px solid var(--hue); border-radius: 12px; padding: 2px 14px 8px; margin: 12px 0; background: var(--surface); }
.sessions > li { margin: 8px 0; }
.sessions ul { margin: 4px 0; padding-left: 1.1em; }
.fnames { list-style: none; padding: 0; }
.fnames li { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.fnames code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; overflow-wrap: anywhere; font-size: .92rem; }
.fcard { border: 2px solid var(--ink); border-radius: 16px; padding: 28px 18px; margin: 14px 0; background: var(--surface); text-align: center; min-height: 180px; }
.fcard.back { background: var(--surface2); }
.fterm { font-family: var(--f-head); font-size: 1.6rem; font-weight: 800; margin: 0 0 10px; }
.fdef { font-size: 1.15rem; }
.wordchips .lens { margin: 3px 2px; font-size: .9rem; }
table.sam.progt { min-width: 520px; }
.ican { display: block; font-size: .9rem; color: var(--muted); margin-top: 2px; }
.weeks { list-style: none; padding: 0; }
.weeks li { display: grid; gap: 2px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; margin: 8px 0; background: var(--surface); }
.weeks li.now { border-color: var(--hue); box-shadow: inset 4px 0 0 var(--hue); }
.weeks .uchip { min-height: 28px; min-width: 40px; }
/* ===== new guide look ===== */
.ghero { position: relative; overflow: hidden; border-radius: 20px; padding: 18px 18px 16px; margin: 6px 0 14px; color: #fff; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; background: radial-gradient(circle at 92% 8%, rgba(255,255,255,.08) 0, transparent 40%), linear-gradient(135deg, var(--gh1), var(--gh2)); }
.ghero.a1 { --gh1: #1b3a91; --gh2: #2457d6; } .ghero.a2 { --gh1: #084f4c; --gh2: #0a7470; } .ghero.a3 { --gh1: #4a2380; --gh2: #8240be; }

@media (max-width: 480px) { .gh-art svg { width: 104px; } .ghero { padding: 16px 14px 14px; } }

.journey a { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 700; font-size: .92rem; line-height: 1.2; }
.journey .jn { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); font-size: .85rem; font-weight: 800; color: var(--ink); }

.bl h3 { margin: 0; }

.bl-check { margin-top: 12px; border-top: 2px dashed var(--line); padding-top: 4px; }
.bl-check summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 800; }
.bl-out { margin: 6px 0 0; }

/* shell: the same graphite top bar everywhere */
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); }
.topbar { background: #16161A; border-bottom: 2px solid #2A2F38; }
.topbar .brand { color: #FFFFFF; font-family: 'Space Grotesk', var(--f-body); }
.topbar .nav a { color: #FFFFFF; }
.topbar .nav a:hover { background: #2A2F38; }
.topbar .nav a[aria-current="page"], .topbar .nav a[aria-current="page"]:hover { background: none; color: #FFFFFF; box-shadow: inset 0 -3px 0 #FFB020; border-radius: 0; }
.topbar button, .topbar .a11yb { color: #FFFFFF; border-color: #3A404B; background: none; }
h1, h2, h3 { font-family: var(--f-head); }
/* SOC */
.dist-soc .hero2 { background: #181B21; border: 2px solid #FFB020; }
.dist-soc .hero2 .hero-art { display: none; }
.dist-soc .banner { background: var(--surface); color: var(--ink); border: 2px solid var(--accent); }
.dist-soc .atile { background: var(--surface); background-image: none; color: var(--ink); border: 2px solid var(--hue); }
.dist-soc .atile * { color: var(--ink); border-color: var(--line-d); }
.dist-soc .atile *:not(i) { background: transparent; }
.dist-soc .atile .bgi { display: none; }
.soc { display: grid; gap: 12px; margin: 16px 0; }
.soc-threat { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 2px solid var(--accent); }
.soc-threat > div { flex: 1; }
.soc-threat p { margin: 0; }
.soc-threat svg { stroke: var(--accent); flex: 0 0 auto; }
.soc-lvl { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: .8rem; letter-spacing: .08em; color: var(--accent); }
.soc-days { font-family: 'Space Grotesk', var(--f-body); font-size: 2.6rem; font-weight: 700; line-height: 1.05; }
.soc-what { color: var(--muted); }
.soc-gauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

<body>
<header class="topbar"><div class="in"><a class="brand" href="#/">OSP portal</a>
<nav class="nav" aria-label="Main"><a href="#/" data-nav="home" aria-current="page">Home</a><a href="#/knowledge" data-nav="knowledge">Knowledge</a><a href="#/planner" data-nav="planner">Planner</a><a href="#/settings" data-nav="settings" class="aa" aria-label="Reading and display options">Aa</a></nav></div></header>
<main id="app" aria-live="off"></main>
<script>
/* ===== SVG diagram generators. Colours come from CSS classes so dark mode works. ===== */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const DEFS = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-arrow"/></marker></defs>';
const svg = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}" class="diagram">${DEFS}${inner}</svg>`;

// wrap a label to fit a box (only when the label has no explicit line breaks)
function wrap(s, max) {
  s = String(s);
  if (s.indexOf('\n') >= 0) return s;
  const words = s.split(' '), lines = [];
  let cur = '';
  words.forEach(w => {
    if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; } else { cur = cur ? cur + ' ' + w : w; }
  });
  if (cur) lines.push(cur);
  return lines.join('\n');
}
// multi-line text centred at x,y
function txt(x, y, s, cls = 'd-t', lh = 15) {
  const lines = String(s).split('\n');
  const y0 = y - ((lines.length - 1) * lh) / 2;
  return `<text x="${x}" y="${y0}" class="${cls}" text-anchor="middle" dominant-baseline="middle">` +
    lines.map((l, i) => `<tspan x="${x}" dy="${i === 0 ? 0 : lh}">${esc(l)}</tspan>`).join('') + '</text>';
}
const rect = (x, y, w, h, s, cls = 'c1', r = 8) => {
  const small = w < 90, lh = small ? 13 : 15;
  const max = Math.max(4, Math.floor((w - 10) / (small ? 6.2 : 7.2)));
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="d-box ${cls}"/>` + txt(x + w / 2, y + h / 2, wrap(s, max), small ? 'd-t d-small' : 'd-t', lh);
};
const arrow = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="d-line" marker-end="url(#ah)"/>`;
const path = (d, extra = '') => `<path d="${d}" class="d-line d-nofill" marker-end="url(#ah)" ${extra}/>`;

const DIAG = {};

// Circular cycle of N labelled boxes with arrows between them.
DIAG.cycle = (labels, centre = '', opts = {}) => {
  const w = opts.w || 360, h = opts.h || 320, n = labels.length;
  const cx = w / 2, cy = h / 2, rx = w / 2 - (opts.bw || 62), ry = h / 2 - 30, bw = opts.bw ? opts.bw * 2 : 118, bh = 38;
  let out = '', boxes = '';
  const ang = i => (-90 + (360 / n) * i) * Math.PI / 180;
  const off = opts.off || (n <= 4 ? 30 : n === 5 ? 25 : 22);
  for (let i = 0; i < n; i++) {
    const a1 = ang(i) + off * Math.PI / 180 * 1, a2 = ang(i + 1) - off * Math.PI / 180;
    const x1 = cx + rx * Math.cos(a1), y1 = cy + ry * Math.sin(a1), x2 = cx + rx * Math.cos(a2), y2 = cy + ry * Math.sin(a2);
    out += path(`M${x1.toFixed(1)} ${y1.toFixed(1)} A${rx} ${ry} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`);
    const bx = cx + rx * Math.cos(ang(i)) - bw / 2, by = cy + ry * Math.sin(ang(i)) - bh / 2;
    boxes += rect(bx, by, bw, bh, labels[i], 'c' + ((i % 6) + 1));
  }
  if (centre) out += txt(cx, cy, centre, 'd-t d-muted');
  return svg(w, h, out + boxes, opts.label || 'Cycle diagram: ' + labels.join(', '));
};

// Vertical or horizontal chain of boxes.
DIAG.chain = (steps, opts = {}) => {
  const horiz = !!opts.horiz, n = steps.length;
  if (horiz) {
    const bw = opts.bw || 92, gap = 22, bh = opts.bh || 54, w = n * bw + (n - 1) * gap + 20, h = bh + 20;
    let out = '';
    steps.forEach((s, i) => {
      const x = 10 + i * (bw + gap);
      out += rect(x, 10, bw, bh, s, 'c' + ((i % 6) + 1));
      if (i < n - 1) out += arrow(x + bw + 2, 10 + bh / 2, x + bw + gap - 2, 10 + bh / 2);
    });
    return svg(w, h, out, opts.label || 'Process: ' + steps.join(' then '));
  }
  const bw = opts.bw || 250, bh = opts.bh || 36, gap = 20, w = bw + 20, h = n * bh + (n - 1) * gap + 20;
  let out = '';
  steps.forEach((s, i) => {
    const y = 10 + i * (bh + gap);
    out += rect(10, y, bw, bh, s, 'c' + ((i % 6) + 1));
    if (i < n - 1) out += arrow(10 + bw / 2, y + bh + 1, 10 + bw / 2, y + bh + gap - 1);
  });
  return svg(w, h, out, opts.label || 'Process: ' + steps.join(' then '));
};

// Layer stack: layers = [{t, n}] top to bottom.
DIAG.stack = (layers, opts = {}) => {
  const w = opts.w || 360, lh = opts.lh || 40, gap = 4, h = layers.length * (lh + gap) + 8;
  let out = '';
  layers.forEach((l, i) => {
    const y = 4 + i * (lh + gap);
    out += `<rect x="6" y="${y}" width="${w - 12}" height="${lh}" rx="6" class="d-box c${(i % 7) + 1}"/>`;
    out += `<text x="16" y="${y + lh / 2}" class="d-t d-b" dominant-baseline="middle">${esc(l.t)}</text>`;
    if (l.n) out += `<text x="${w - 16}" y="${y + lh / 2}" class="d-t d-small" text-anchor="end" dominant-baseline="middle">${esc(l.n)}</text>`;
  });
  return svg(w, h, out, opts.label || 'Layers: ' + layers.map(l => l.t).join(', '));
};

// 5x5 risk matrix.
DIAG.matrix = () => {
  const L = ['Improbable', 'Remote', 'Occasional', 'Probable', 'Frequent'];
  const S = ['Negligible', 'Marginal', 'Moderate', 'Critical', 'Catastrophic'];
  const x0 = 92, y0 = 8, cw = 50, ch = 38, w = x0 + 5 * cw + 52, h = y0 + 5 * ch + 92;
  let out = '';
  for (let r = 0; r < 5; r++) {            // r=0 top = severity 5
    const sev = 5 - r;
    out += `<text x="${x0 - 6}" y="${y0 + r * ch + ch / 2}" class="d-t d-small" text-anchor="end" dominant-baseline="middle">${S[sev - 1]}</text>`;
    for (let c = 0; c < 5; c++) {
      const sc = sev * (c + 1), k = sc <= 4 ? 'r1' : sc <= 9 ? 'r2' : sc <= 16 ? 'r3' : 'r4';
      out += `<rect x="${x0 + c * cw}" y="${y0 + r * ch}" width="${cw - 2}" height="${ch - 2}" rx="4" class="d-box ${k}"/>` + txt(x0 + c * cw + cw / 2 - 1, y0 + r * ch + ch / 2 - 1, sc);
    }
  }
  for (let c = 0; c < 5; c++) out += `<text transform="translate(${x0 + c * cw + cw / 2 + 4} ${y0 + 5 * ch + 6}) rotate(40)" class="d-t d-small">${L[c]}</text>`;
  out += `<text x="${x0 + 2.5 * cw}" y="${h - 6}" class="d-t d-b" text-anchor="middle">Likelihood (across)</text>`;
  out += `<text x="10" y="${h - 6}" class="d-t d-b">Severity (up)</text>`;
  return svg(w, h, out, 'Five by five risk matrix. Risk score equals likelihood multiplied by severity.');
};

// CIA triad
DIAG.cia = () => {
  const node = (x, y, t, c) => `<rect x="${x - 70}" y="${y - 20}" width="140" height="40" rx="20" class="d-box ${c}"/>` + txt(x, y, t, 'd-t d-b');
  const out = `<polygon points="180,40 78,236 282,236" class="d-box c6" style="fill-opacity:.28"/>` + node(180, 30, 'Confidentiality', 'c1') + node(78, 244, 'Integrity', 'c3') + node(282, 244, 'Availability', 'c2') +
    txt(180, 118, 'Keep data private\nby controlling access', 'd-t d-small') + txt(84, 160, 'Confidentiality\nsupports integrity', 'd-t d-small d-muted') + txt(276, 160, 'Integrity\nsupports availability', 'd-t d-small d-muted') + txt(180, 196, 'Data is trusted and\nready to use', 'd-t d-small');
  return svg(360, 276, out, 'CIA triad: confidentiality, integrity, availability');
};

// IAAA chain
DIAG.iaaa = () => {
  const items = [['Identification', 'Who are you?\nusername, badge'], ['Authentication', 'Prove it.\npassword, MFA, biometric'], ['Authorisation', 'What can you do?\nroles, ACLs'], ['Accountability', 'What did you do?\naudit logs']];
  let out = '';
  items.forEach((it, i) => {
    const y = 8 + i * 84;
    out += rect(10, y, 150, 44, it[0], 'c' + (i + 1));
    out += txt(262, y + 22, it[1], 'd-t d-small');
    if (i < 3) out += arrow(85, y + 46, 85, y + 80);
  });
  return svg(360, 8 + 3 * 84 + 54, out, 'IAAA model: identification, authentication, authorisation, accountability');
};

// Network topologies
DIAG.topo = type => {
  const node = (x, y, l = '') => `<circle cx="${x}" cy="${y}" r="13" class="d-box c2"/>` + (l ? txt(x, y, l, 'd-t d-small') : '');
  const ln = (a, b, c, d) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" class="d-line"/>`;
  let out = '';
  if (type === 'star') {
    const c = [130, 110], p = [[130, 24], [210, 70], [210, 150], [130, 196], [50, 150], [50, 70]];
    p.forEach(q => out += ln(c[0], c[1], q[0], q[1]));
    p.forEach(q => out += node(q[0], q[1]));
    out += `<rect x="106" y="94" width="48" height="32" rx="6" class="d-box c4"/>` + txt(130, 110, 'Switch', 'd-t d-small');
    return svg(260, 220, out + txt(130, 214, 'Star: every device links to a central switch', 'd-t d-small d-muted'), 'Star topology');
  }
  if (type === 'mesh') {
    const p = [[130, 24], [215, 80], [190, 165], [70, 165], [45, 80]];
    for (let i = 0; i < p.length; i++) for (let j = i + 1; j < p.length; j++) out += ln(p[i][0], p[i][1], p[j][0], p[j][1]);
    p.forEach(q => out += node(q[0], q[1]));
    return svg(260, 220, out + txt(130, 208, 'Mesh: every device links to every other', 'd-t d-small d-muted'), 'Mesh topology');
  }
  const root = [130, 26], mid = [[60, 90], [200, 90]], leaf = [[25, 160], [95, 160], [165, 160], [235, 160]];
  mid.forEach(m => out += ln(root[0], root[1], m[0], m[1]));
  [[0, 0], [0, 1], [1, 2], [1, 3]].forEach(([a, b]) => out += ln(mid[a][0], mid[a][1], leaf[b][0], leaf[b][1]));
  out += node(root[0], root[1]);
  mid.forEach(m => out += `<rect x="${m[0] - 24}" y="${m[1] - 14}" width="48" height="28" rx="6" class="d-box c4"/>` + txt(m[0], m[1], 'Switch', 'd-t d-small'));
  leaf.forEach(l => out += node(l[0], l[1]));
  return svg(260, 220, out + txt(130, 208, 'Tree: switches linked in a hierarchy', 'd-t d-small d-muted'), 'Tree topology');
};

// DFD example (own scenario)

// Waterfall and agile
DIAG.wfagile = () => {
  const st = ['Requirements', 'Design', 'Build', 'Test', 'Release'];

  st.forEach((s, i) => { out += rect(6 + i * 18, 22 + i * 40, 112, 28, s, 'c' + (i + 1), 4); if (i < 4) out += arrow(96 + i * 18, 50 + i * 40, 96 + i * 18, 61 + i * 40); });

  return svg(360, 224, out, 'Waterfall steps and agile repeated cycles');
};
DIAG._inner_cycle = (cx, cy, r = 66) => {
  const labs = ['Plan', 'Build', 'Test', 'Review'], pos = [[0, -r], [r, 0], [0, r], [-r, 0]];
  let o = '';
  pos.forEach((p, i) => { const q = pos[(i + 1) % 4]; o += path(`M${cx + p[0] * .62} ${cy + p[1] * .62} L${cx + q[0] * .62} ${cy + q[1] * .62}`); });
  pos.forEach((p, i) => { o += rect(cx + p[0] - 38, cy + p[1] - 15, 76, 30, labs[i], 'c' + (i + 1), 6); });
  return o;
};

function icon(name, x, y, size = 24) {
  const s = size / 24;

}
// a standalone icon for use in the page (inherits text colour)
function iconSvg(name, size = 28, label = '') { return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}>${ICONS[name] || ''}</svg>`; }

// cards: items [{t, s, i, c}]
DIAG.cards = (items, o = {}) => {
  const cols = o.cols || 2, W = o.w || 360, gap = 8, cw = (W - 12 - gap * (cols - 1)) / cols;
  const lines = items.map(it => it.s ? wrap(it.s, Math.floor((cw - 18) / (it.mono ? 7.6 : 6.3))).split('\n') : []);
  const ch = o.ch || Math.max(...lines.map(l => 38 + l.length * 14 + 6), 46);
  const rows = Math.ceil(items.length / cols);
  let out = '';
  items.forEach((it, k) => {
    const r = Math.floor(k / cols), c = k % cols, x = 6 + c * (cw + gap), y = 6 + r * (ch + gap);
    out += `<rect x="${x.toFixed(1)}" y="${y}" width="${cw.toFixed(1)}" height="${ch}" rx="9" class="d-box ${it.c || 'c' + ((k % 7) + 1)}"/>`;
    if (it.i) out += icon(it.i, x + 19, y + 19, 21);
    out += `<text x="${(x + (it.i ? 34 : 10)).toFixed(1)}" y="${y + 20}" class="d-t d-b${it.t.length * 9 > cw - (it.i ? 40 : 18) ? ' d-small' : ''}" dominant-baseline="middle">${esc(it.t)}</text>`;
    lines[k].forEach((l, j) => { out += `<text x="${(x + 10).toFixed(1)}" y="${y + 42 + j * 14}" class="d-t d-small${it.mono ? ' d-mono' : ''}">${esc(l)}</text>`; });
  });
  return svg(W, 12 + rows * (ch + gap) - gap, out, o.label || items.map(i => i.t + (i.s ? ': ' + i.s : '')).join('. '));
};
// hub and spokes
DIAG.hub = (centre, items, o = {}) => {
  const W = o.w || 360, n = items.length, bh = o.bh || 48;
  let H = o.h || 340, bw = o.bw || 112;
  const place = () => items.map((it, k) => { const a = (-90 + (360 / n) * k) * Math.PI / 180, rx = W / 2 - bw / 2 - 6, ry = H / 2 - bh / 2 - 6; return [W / 2 + rx * Math.cos(a), H / 2 + ry * Math.sin(a)]; });
  const clash = ps => ps.some((p, i) => ps.some((q, j) => j > i && Math.abs(p[0] - q[0]) < bw + 4 && Math.abs(p[1] - q[1]) < bh + 4));
  for (let g = 0; g < 40 && clash(place()); g++) { if (H < 420) H += 10; else if (bw > 92) bw -= 4; else break; }
  const cx = W / 2, cy = H / 2, rx = W / 2 - bw / 2 - 6, ry = H / 2 - bh / 2 - 6;
  let lines = '', boxes = '';
  items.forEach((it, k) => {
    const a = (-90 + (360 / n) * k) * Math.PI / 180, x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
    lines += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="d-line"/>`;
    boxes += `<rect x="${(x - bw / 2).toFixed(1)}" y="${(y - bh / 2).toFixed(1)}" width="${bw}" height="${bh}" rx="9" class="d-box ${it.c || 'c' + ((k % 7) + 1)}"/>`;
    if (it.i) boxes += icon(it.i, x - bw / 2 + 15, y, 18);
    boxes += txt(x + (it.i ? 9 : 0), y, wrap(it.t, it.i ? 11 : 13), 'd-t d-small d-b', 13);
  });
  const cr = o.cr || 48;
  const centreTxt = txt(cx, cy, wrap(centre, 11), 'd-t d-b', 15);
  return svg(W, H, lines + boxes + `<circle cx="${cx}" cy="${cy}" r="${cr}" class="d-box c6"/>` + centreTxt, o.label || centre + ': ' + items.map(i => i.t).join(', '));
};
// two columns joined by a "leads to" arrow
DIAG.leads = (lt, left, rt, right, o = {}) => {
  const bh = 34, gap = 6, h = Math.max(left.length, right.length) * (bh + gap) + 40;
  let out = txt(80, 12, lt, 'd-t d-b') + txt(282, 12, rt, 'd-t d-b');
  left.forEach((l, k) => { out += rect(6, 28 + k * (bh + gap), 150, bh, l, 'c4', 7); });
  right.forEach((r, k) => { out += rect(210, 28 + k * (bh + gap), 144, bh, r, 'c6', 7); });
  out += `<path d="M162 ${h / 2 + 6} H204" class="d-line d-thick" marker-end="url(#ah)"/>`;
  return svg(360, h, out, o.label || lt + ' ' + left.join(', ') + '. ' + rt + ' ' + right.join(', '));
};

const tl = (x, y, s, cls = 'd-t d-small d-b') => `<text x="${x}" y="${y}" class="${cls}" dominant-baseline="middle">${esc(s)}</text>`;
const tc = (x, y, s, cls = 'd-t d-small') => txt(x, y, s, cls, 13);
const dev = (x, y, w, s, cls) => `<rect x="${x}" y="${y}" width="${w}" height="22" rx="5" class="d-box ${cls || 'c1'}"/>` + tc(x + w / 2, y + 11, s);
const ln = (x1, y1, x2, y2, cls = 'd-line') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}"/>`;

// Floor plan from data: outer box, internal walls, open boundaries, room names, devices, doors/windows/fire exits
function floorPlan(F, label) {
  let o = `<rect x="${F.outer[0]}" y="${F.outer[1]}" width="${F.outer[2]}" height="${F.outer[3]}" class="fp-wall"/>`;
  (F.walls || []).forEach(w => { o += ln(w[0], w[1], w[2], w[3], 'fp-wall'); });
  (F.open || []).forEach(w => { o += ln(w[0], w[1], w[2], w[3], 'fp-open'); });
  (F.gaps || []).forEach(g => { o += ln(g[0], g[1], g[2], g[3], 'fp-gap ' + g[4]); if (g[5]) o += tc(g[6], g[7], g[5]); });
  (F.rooms || []).forEach(r => { o += tl(r[0], r[1], r[2]); });
  (F.devs || []).forEach(d => { o += dev(d[0], d[1], d[2], d[3], d[4]); });
  const ly = F.legend;
  o += ln(16, ly, 40, ly, 'fp-gap fp-door') + tl(46, ly, 'Door', 'd-t d-small') + ln(100, ly, 124, ly, 'fp-gap fp-win') + tl(130, ly, 'Window', 'd-t d-small') + ln(196, ly, 220, ly, 'fp-gap fp-fire') + tl(226, ly, 'Fire exit', 'd-t d-small');
  return svg(F.w, F.h, o, label);
}

FIGS.riskChain = () => {
  let o = '';
  const B = [['Threat', 'Who or what causes harm, and how', 'c4'], ['Vulnerability', 'The gap that lets the threat in', 'c6'], ['Asset', 'The exact thing that is harmed', 'c1'], ['Impact', 'What it costs the organisation', 'c3']];

  ['uses', 'to reach', 'causing'].forEach((v, k) => { o += tl(138, 75 + k * 76, v, 'd-t d-small d-muted'); });
  o += `<rect x="254" y="10" width="92" height="282" rx="8" class="d-box c5"/>` + tc(300, 151, 'Likelihood\nhow probable\nis this whole\nchain?\n\nRisk level\nlikelihood\ntimes impact', 'd-t d-small');

const LVL = s => s >= 20 ? ['r4', 'Critical'] : s >= 10 ? ['r3', 'High'] : s >= 5 ? ['r2', 'Medium'] : ['r1', 'Low'];
FIGS.matrix = () => {
  let o = tl(10, 14, 'Likelihood', 'd-t d-small d-b');

    if (L === 1) o += tc(x + 28, 268, String(I), 'd-t d-b');
  }

const tml = (x, y, lines, cls = 'd-t d-small', lh = 15) => `<text x="${x}" y="${y}" class="${cls}" dominant-baseline="middle">${lines.map((l, i) => `<tspan x="${x}" dy="${i ? lh : 0}">${esc(l)}</tspan>`).join('')}</text>`;
const wrapL = (s, n) => wrap(s, n).split('\n');
const badge = (n, x, y) => `<circle cx="${x}" cy="${y}" r="10" class="d-box r4"/>` + tc(x, y, String(n), 'd-t d-small d-b');
// Cards with an icon in a circle on the left, a title and up to three lines
function iconCards(items, cols, cw, ch, label) {
  let o = '';
  items.forEach((it, k) => {
    const x = 6 + (k % cols) * (cw + 8), y = 6 + Math.floor(k / cols) * (ch + 8), cy = y + ch / 2;
    o += `<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="10" class="d-box ${it[2]}"/><circle cx="${x + 24}" cy="${cy}" r="17" class="d-disc"/>` + ico(it[3], x + 13, cy - 11, 22);
    const lines = wrapL(it[1], Math.floor((cw - 56) / 6.3)), top = cy - (lines.length * 14 + 16) / 2 + 7;
    o += tl(x + 48, top, it[0]) + tml(x + 48, top + 17, lines, 'd-t d-small', 14);
  });
  const rows = Math.ceil(items.length / cols);
  return svg(6 + cols * cw + (cols - 1) * 8 + 6, 6 + rows * ch + (rows - 1) * 8 + 6, o, label);
}
// Small square tiles: icon on top, name underneath
function tiles(items, cols, tw, th, label) {
  let o = '';
  items.forEach((it, k) => { const x = 6 + (k % cols) * (tw + 6), y = 6 + Math.floor(k / cols) * (th + 6); o += `<rect x="${x}" y="${y}" width="${tw}" height="${th}" rx="10" class="d-box ${it[2]}"/>` + ico(it[3], x + tw / 2 - 12, y + 9, 24) + tc(x + tw / 2, y + th - 17, it[0] + (it[1] ? '\n' + it[1] : ''), 'd-t d-small'); });
  const rows = Math.ceil(items.length / cols);
  return svg(6 + cols * tw + (cols - 1) * 6 + 6, 6 + rows * th + (rows - 1) * 6 + 6, o, label);
}

// How the content areas flow into the tasks. Totals are Pearson's: performance outcome marks (35, 38, 26) and task marks (51, 30, 18).
// The split between them is estimated from which tasks each area's spec points are used in, scaled to match both sets of totals.
function caFlowMatrix() {
  const ca = [35, 38, 26], tk = [51, 30, 18], m = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
  SPEC.forEach(s => { const a = +s[0].split('.')[0] - 1; const ts = new Set(s[2].map(x => ACTS[x].task - 1)); ts.forEach(t => { m[a][t] += 1 / ts.size; }); });
  for (let it = 0; it < 60; it++) {
    m.forEach((row, i) => { const s = row.reduce((x, y) => x + y, 0); row.forEach((v, j) => { row[j] = v * ca[i] / s; }); });
    for (let j = 0; j < 3; j++) { const s = m.reduce((x, r) => x + r[j], 0); m.forEach(r => { r[j] = r[j] * tk[j] / s; }); }
  }
  return m;
}
FIGS.caFlow = () => {
  const m = caFlowMatrix(), ca = [35, 38, 26], tk = [51, 30, 18], k = 2.3, g = 12, x1 = 108, x2 = 252;
  const caY = [], tkY = []; let y = 10; ca.forEach(v => { caY.push(y); y += v * k + g; }); y = 10; tk.forEach(v => { tkY.push(y); y += v * k + g + 4; });
  const cls = ['c4', 'c6', 'c7'], tcls = ['c1', 'c2', 'c3'];
  let o = ''; const off = [0, 0, 0], tin = [0, 0, 0];
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
    const h = m[i][j] * k, ya = caY[i] + off[i], yb = tkY[j] + tin[j]; off[i] += h; tin[j] += h;
    o += `<path d="M${x1} ${ya} C180 ${ya} 180 ${yb} ${x2} ${yb} V${yb + h} C180 ${yb + h} 180 ${ya + h} ${x1} ${ya + h} Z" class="d-flow ${cls[i]}"/>`;
  }
  ca.forEach((v, i) => { o += `<rect x="${x1 - 14}" y="${caY[i]}" width="14" height="${v * k}" rx="3" class="d-box ${cls[i]}"/>` + tml(6, caY[i] + v * k / 2 - 7, ['Area ' + (i + 1), v + ' marks'], 'd-t d-small d-b', 15); });
  tk.forEach((v, j) => { o += `<rect x="${x2}" y="${tkY[j]}" width="14" height="${v * k}" rx="3" class="d-box ${tcls[j]}"/>` + tml(274, tkY[j] + v * k / 2 - 7, ['Task ' + (j + 1), v + ' marks'], 'd-t d-small d-b', 15); });
  return svg(360, Math.max(caY[2] + ca[2] * k, tkY[2] + tk[2] * k) + 10, o, 'How the three content areas feed the three tasks. Area 1 carries 35 marks, area 2 carries 38 and area 3 carries 26. Task 1 is worth 51, Task 2 30 and Task 3 18. The ribbons estimate how each area’s marks spread across the tasks.');
};
