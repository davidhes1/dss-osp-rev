FIGS.ce5 = () => iconCards([['Firewalls', 'Restrict traffic in and out', 'c6', 'firewall'], ['Secure configuration', 'Only what users need', 'c1', 'gear'], ['User access control', 'Right accounts, right rights', 'c4', 'key'], ['Malware protection', 'Up-to-date anti-malware', 'c7', 'shield'], ['Security updates', 'Systems kept patched', 'c3', 'cycle']], 1, 346, 56, 'The five Cyber Essentials controls: firewalls, secure configuration, user access control, malware protection and security update management.');
FIGS.backupTypes = () => {
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu'], rows = [['Full', 'c1', [1, 1, 1, 1, 1]], ['Incremental', 'c7', [1, .2, .2, .2, .2]], ['Differential', 'c4', [1, .2, .4, .6, .8]]];
  let o = '';
  days.forEach((d, i) => { o += tc(118 + i * 50, 14, d, 'd-t d-small d-b'); });
  rows.forEach((r, k) => { const y = 30 + k * 46; o += tl(8, y + 15, r[0], 'd-t d-small d-b'); r[2].forEach((v, i) => { o += `<rect x="${96 + i * 50}" y="${y}" width="${Math.round(44 * v)}" height="30" rx="4" class="d-box ${r[1]}"/>`; }); });
  o += tc(180, 186, 'Bar width shows how much is copied each day.', 'd-t d-small d-muted');
  return svg(360, 198, o, 'Over a week: a full backup copies everything every day; incremental copies a small amount each day after Sunday; differential copies more each day, since everything changed since Sunday’s full backup.');
};

/* ===== KNOWLEDGE TOPICS: Task 2 slice (14 spec points). Original material. ===== */
const KNOW2 = [
  { id: 'incident', title: 'Incident management, escalation and evidence', ca: 2, spec: ['2.19', '2.20', '2.1'], acts: ['2a'],
    lede: 'What happens from the moment an incident is reported, how to escalate it without destroying evidence, and the principles that keep digital evidence usable.',
    figs: [],
    sec: [
      ['The incident process', '<p>An incident is <b>identified</b> through the service desk, a call, an email, a text or chat, or automatically by a monitoring tool. It is <b>logged</b>: manually, by raising a ticket with the reporter’s contact details, the date and time and a description, or automatically by the tool that spotted it. It is then categorised and prioritised, investigated, resolved and closed, with exceptions recorded along the way.</p>{{fig:incidentFlow}}'],
      ['Escalating while preserving evidence', '<ol><li><b>Record</b> the date, time and a description of what happened.</li><li><b>Take appropriate action</b>, such as isolating the device from the network.</li><li><b>Preserve</b> the evidence by copying the relevant log files before anything is changed.</li><li><b>Escalate</b> to the right person or team.</li></ol><p>Isolating rather than switching off matters: turning a device off can destroy evidence held in memory.</p>'],
      ['Computer forensics principles', '<p>Forensics investigates devices and networks to gather <b>legitimate</b> evidence that could be presented to a body such as the police. <b>Identification:</b> what evidence exists, where and how it is stored. <b>Preservation:</b> no tampering or contamination, accidental or deliberate. The evidence is then analysed, documented and presented, with a record of everyone who handled it.</p>']
    ],
    terms: [['Incident', 'An unplanned event that disrupts a service or threatens security.'], ['Ticket', 'The logged record of an incident or request.'], ['Escalation', 'Passing an incident to someone with more authority or expertise.'], ['Isolation', 'Disconnecting a device from the network to stop harm spreading.'], ['Preservation', 'Keeping evidence unchanged from the moment it is found.'], ['Chain of custody', 'A record of everyone who handled a piece of evidence.']],
    quiz: [
      ord('Put the first steps of handling a suspected infected PC in order.', ['Record the date, time and what was seen', 'Isolate the PC from the network', 'Copy the relevant log files', 'Escalate to the security team'], 'Record, contain, preserve, escalate.'),
      mc('Why isolate an infected PC rather than switch it off?', 'Switching off can destroy evidence held in memory', ['Isolating is quicker than switching off', 'Windows cannot be shut down while infected', 'Switching off spreads the malware to other PCs'], 'Pulling the network cable stops the spread but keeps the evidence.', 2),
      mc('Which belongs in a manually logged ticket?', 'The reporter’s contact details, the date and time, and a description', ['The reporter’s password, so the IT team can sign in and check their account', 'Only the name of the device affected', 'A guess at who the attacker is'], 'Those three let anyone pick up and follow the incident.', 1),
      mt('Match each forensics principle to its meaning.', [['Identification', 'What evidence exists and where it is stored'], ['Preservation', 'Keeping evidence free from tampering'], ['Documentation', 'Recording what was done and by whom']], 'Evidence only counts if it was found, kept and recorded properly.'),
      mc('In a Task 2A report, which recommendation follows these principles?', 'Isolate the till, copy its logs, then escalate to the payment provider', ['Wipe the till and reinstall it straight away', 'Ask café staff to keep trying a few more card payments to see if it works', 'Ignore it unless more customers complain'], 'Contain, preserve, escalate: wiping destroys the evidence.', 3),
      mc('An attack is suspected on Counter PC1. What should be copied before anything changes?', 'Its security and system logs', ['The desktop wallpaper settings', 'The list of installed fonts', 'The printer’s paper settings'], 'Logs are the evidence of what happened and when.', 2)
    ],
    recall: [['List the stages of incident management.', ['Identify', 'Log (manual ticket or automatic)', 'Categorise and prioritise', 'Investigate, resolve and close']], ['How do you escalate an incident while preserving evidence?', ['Record date, time, description', 'Isolate the device if needed', 'Copy relevant log files', 'Escalate appropriately']], ['What are identification and preservation in computer forensics?', ['Identification: what evidence exists, where and how it is stored', 'Preservation: avoid tampering or contamination']]],
    apply: [['2a', 'Recommendations for possible attacks should follow the escalation steps: record, isolate, preserve, escalate.', 'Isolate Public PC3, copy its logs and browser history, run a full scan, then escalate to the council IT team.']] },

  { id: 'itsm', title: 'IT service management and the ITIL lifecycle', ca: 1, spec: ['1.7', '1.8'], acts: ['2a'],
    lede: 'How organisations manage IT services from end to end, and the lifecycle that keeps a service fit for purpose.',
    figs: [['itil', 'The ITIL service lifecycle.']],
    sec: [
      ['IT service management', '<p>ITSM manages the delivery of IT services to customers from end to end. Its core processes include <b>service request management</b> (handling queries and tracking incidents, such as a suspected attack reported to the service desk), <b>knowledge management</b> (keeping documentation current, such as standard hardened builds), <b>IT asset management</b>, and handling changes, incidents and the problems behind them.</p>'],
      ['The ITIL lifecycle', '<ul><li><b>Strategy:</b> the service matches business goals and is fit for purpose and use.</li><li><b>Design:</b> the service and everything supporting it, considering people, processes, products and partners.</li><li><b>Transition:</b> building and deploying it, with changes managed in a coordinated way.</li><li><b>Operation:</b> running the service day to day.</li><li><b>Continual improvement:</b> reviewing and improving it.</li></ul>'],
      ['Incidents and problems', '<p>An <b>incident</b> is one disruption, fixed to restore service. A <b>problem</b> is the underlying cause of one or more incidents. A Task 2A issue that keeps recurring is a sign there is a problem to find, not just an incident to fix.</p>']
    ],
    terms: [['ITSM', 'IT service management: delivering IT services end to end.'], ['ITIL', 'A widely used framework for IT service management.'], ['Service desk', 'The single point of contact for users reporting issues.'], ['Knowledge management', 'Keeping documentation accurate and useful.'], ['Problem', 'The underlying cause of one or more incidents.']],
    quiz: [
      ord('Put the ITIL lifecycle stages in order.', ['Strategy', 'Design', 'Transition', 'Operation', 'Continual improvement'], 'Plan it, design it, deploy it, run it, improve it.'),
      mc('Keeping a documented, standard hardened build up to date is which ITSM process?', 'Knowledge management', ['Service request management', 'IT asset management', 'Service transition'], 'It is about keeping documentation current and useful.', 2),
      mc('What is the difference between an incident and a problem?', 'A problem is the underlying cause of one or more incidents', ['A problem is an incident that costs more money', 'Incidents affect people and problems affect computers', 'There is no difference in ITIL'], 'Fix the incident to restore service; find the problem to stop it recurring.', 2),
      mc('A user reports a suspicious email to the service desk. Which ITSM process handles this?', 'Service request management', ['Knowledge management', 'IT asset management', 'Service strategy'], 'Queries and reported incidents go through service request management.', 1),
      mc('The kiosk restarts every busy afternoon. What does ITSM suggest beyond restarting it?', 'Treat it as a problem and find the underlying cause', ['Restart it each time and log nothing', 'Buy a second kiosk to share the load', 'Turn the kiosk off during every busy period so that it cannot restart'], 'Recurring incidents point to a problem worth investigating.', 3),
      mc('Which lifecycle stage covers deploying a new booking system with managed changes?', 'Transition', ['Strategy', 'Operation', 'Continual improvement'], 'Transition builds, deploys and controls change.', 2)
    ],
    recall: [['Name the five stages of the ITIL lifecycle.', ['Strategy', 'Design', 'Transition', 'Operation', 'Continual improvement']], ['Describe two core ITSM processes with an example of each.', ['Service request management: reporting a suspected attack to the service desk', 'Knowledge management: documented hardened builds', 'IT asset management']], ['Explain the difference between an incident and a problem.', ['Incident: one disruption to restore', 'Problem: the underlying cause, found to prevent repeats']]],
    apply: [['2a', 'Recurring issues are problems with an underlying cause. Saying so, and how you would find it, strengthens a “further investigation” write-up.', 'The internet drops several times a day: log each drop as an incident, then investigate the problem behind them using the router log.']] },

  { id: 'systems', title: 'Operating systems and servers', ca: 1, spec: ['1.5', '1.6'], acts: ['2b', '2a'],
    lede: 'The kinds of operating system and server you will meet, what an operating system does for security, and why virtualisation matters for Task 2B.',
    figs: [['servers', 'Physical servers, virtual machines and containers.']],
    sec: [
      ['Operating systems and their devices', '<ul><li><b>Client:</b> Windows, macOS and Linux on desktops and laptops.</li><li><b>Mobile:</b> Android and iOS on phones and tablets.</li><li><b>Server:</b> Windows Server and Linux, network operating systems running on servers.</li></ul>'],
      ['What an operating system does for security', '<p>It enforces restrictions and controls: user accounts and permissions, a firewall, built-in anti-malware and updates. It also keeps <b>logs</b> of events, which are exactly what you need in an investigation. In Task 2B you are using the operating system’s own security features.</p>'],
      ['Physical and virtual servers', '<p>A <b>physical server</b> runs applications directly on its hardware, with full access to it. <b>Virtualisation</b> lets one piece of hardware run several operating systems at once in isolated environments: <b>virtual machines</b>. <b>Containers</b> isolate individual applications and their packages. The VirtualBox machine you build for Task 2B is a virtual machine: isolated, easy to snapshot and safe to experiment on.</p>']
    ],
    terms: [['Network operating system', 'An operating system that runs a server.'], ['Virtual machine', 'A complete computer running in software on a host.'], ['Hypervisor', 'Software, such as VirtualBox, that runs virtual machines.'], ['Container', 'An isolated package for one application and what it needs.'], ['Snapshot', 'A saved state of a virtual machine you can return to.']],
    quiz: [
      mt('Match each operating system to its type.', [['Windows Server', 'Server'], ['Android', 'Mobile'], ['macOS', 'Client']], 'Client systems run on desktops and laptops; server systems run network services.'),
      mc('What does virtualisation let one physical machine do?', 'Run several isolated operating systems at once', ['Run faster than its hardware allows', 'Avoid needing any operating system', 'Connect to more than one network cable'], 'That is why one lab PC can run your Task 2B Windows 11 machine.', 1),
      mc('How does a container differ from a virtual machine?', 'It isolates one application rather than a whole computer', ['It always runs on a physical server', 'It cannot run on Linux at all', 'It is just another word for a VirtualBox snapshot of a machine'], 'Containers package an application; virtual machines emulate a whole computer.', 2),
      mc('Why is a VirtualBox snapshot useful in Task 2B?', 'You can return to a clean state if something goes wrong', ['It makes Windows install twice as quickly', 'It counts as the scheduled backup that the requirement asks for', 'It hides your settings from the examiner'], 'A snapshot is a safety net, not a backup of the user’s files.', 2),
      mc('Which operating system feature gives you evidence in a Task 2A investigation?', 'Event logs', ['Desktop themes', 'Screen resolution', 'Font settings'], 'Logs record what happened and when.', 2),
      mc('The clinic wants several services on one server, kept apart from each other. Which approach fits?', 'Virtual machines or containers on one physical server', ['One physical server per patient', 'Running every service together inside one single shared program', 'Switching services on and off by hand'], 'Isolation on shared hardware is what virtualisation is for.', 3)
    ],
    recall: [['Name the three types of operating system, with an example and a device for each.', ['Client: Windows on a laptop', 'Mobile: Android on a phone', 'Server: Windows Server or Linux on a server']], ['Explain virtual machines and containers.', ['Virtual machine: whole OS isolated on shared hardware', 'Container: one application and its packages isolated']], ['What security features does an operating system provide?', ['Accounts and permissions', 'Firewall', 'Anti-malware', 'Updates', 'Event logs']]],
    apply: [['2b', 'Your Task 2B computer can be a virtual machine. Built-in operating system features meet every requirement.', 'A Windows 11 Education virtual machine in VirtualBox, secured with Defender, the firewall and Local Security Policy.'], ['2a', 'Operating system logs are the evidence behind your further investigation steps.', 'Check the Windows security log on Office PC1 for failed log-ons.']] },

  { id: 'vtools', title: 'Vulnerability tools, penetration testing and research', ca: 2, spec: ['2.9', '2.17', '3.3'], acts: ['2a', '3'],
    lede: 'What scanners can and cannot tell you, the stages of a penetration test, and how to research a scenario well.',
    figs: [['pentest', 'The stages of a penetration test.']],
    sec: [
      ['Infrastructure scanners', '<p>Scanners check hosts, networks and wireless. <b>Strengths:</b> they find missing patches, unsupported systems, weak passwords, exposed services, missing hardening and incorrect access controls. <b>Weaknesses:</b> they do not protect against attacks, they only find threats that are already known, and vendors can take time to release fixes.</p>'],
      ['Penetration testing', '<ol><li><b>Planning and scoping:</b> rules of engagement, timings, the law and the contract.</li><li><b>Reconnaissance:</b> gathering information about the business and its systems.</li><li><b>Scanning:</b> finding open ports and services.</li><li><b>Vulnerability assessment:</b> identifying weaknesses.</li><li><b>Exploitation:</b> safely proving which weaknesses can be used.</li><li><b>Reporting:</b> findings and recommendations.</li></ol>'],
      ['Researching a scenario', '<p>Work out what the scenario needs, then search sources and extract what is relevant: threat intelligence, common attack techniques, policies and procedures, guidelines, legislation and standards, and new issues. In Tasks 1 and 2 you have monitored internet access, so researching well is a skill that earns marks; in Task 3 you have none.</p>']
    ],
    terms: [['Vulnerability scanner', 'A tool that checks systems for known weaknesses.'], ['Penetration test', 'An authorised, simulated attack to find real weaknesses.'], ['Rules of engagement', 'What testers may and may not do, agreed in advance.'], ['Reconnaissance', 'Gathering information about a target before testing.'], ['Threat intelligence', 'Current information about attackers and their methods.']],
    quiz: [
      ord('Put the stages of a penetration test in order.', ['Planning and scoping', 'Reconnaissance', 'Scanning', 'Vulnerability assessment', 'Exploitation', 'Reporting'], 'Agree the rules, learn, scan, assess, prove, report.'),
      ms('Select the two weaknesses of infrastructure scanners.', ['They only find threats already known', 'They do not protect against attacks'], ['They cannot find missing patches', 'They never find weak passwords', 'They only work on wireless networks'], 'Scanners find known issues; they do not defend anything.'),
      mc('Which stage agrees the rules of engagement?', 'Planning and scoping', ['Reconnaissance', 'Exploitation', 'Reporting'], 'Testing without agreed rules could break the Computer Misuse Act.', 1),
      mc('Why might a scan miss a brand-new attack technique?', 'Scanners only look for weaknesses that are already known', ['Scanners only run on Tuesdays by default', 'New attacks never affect Windows computers', 'Scanners always switch themselves off as soon as they find malware'], 'That is why monitoring and patching matter as well as scanning.', 2),
      mc('In Task 2A, where could research help most?', 'Checking whether a symptom matches a known attack technique', ['Finding a ready-made report online to copy into your own report', 'Asking an AI tool to categorise the issues', 'Reading general news about technology'], 'Monitored research is allowed; copying and AI tools are not.', 3),
      mc('Which source would best support a claim about a common attack technique?', 'MITRE ATT&CK', ['A random forum post', 'An advert for antivirus', 'A social media rumour'], 'Use recognised knowledge bases.', 2)
    ],
    recall: [['List three strengths and two weaknesses of infrastructure scanners.', ['Find missing patches, unsupported systems, weak passwords, exposed services', 'Do not protect; only find known threats; vendor fixes can be slow']], ['Name the six stages of a penetration test.', ['Planning and scoping', 'Reconnaissance', 'Scanning', 'Vulnerability assessment', 'Exploitation', 'Reporting']], ['How should you research a scenario?', ['Identify what the scenario needs', 'Search suitable sources', 'Extract only what is relevant']]],
    apply: [['2a', 'Scans and tests are legitimate further investigation steps, as long as you say what they would show.', 'Scan the clinic network for devices with default passwords to confirm whether the smart bikes are exposed.'], ['3', 'Knowing what scanners miss helps you judge your own work honestly.', 'My risk assessment relied on a visual check of the floor plan; a vulnerability scan would find software weaknesses I could not see.']] },

  { id: 'ce', title: 'NCSC Cyber Essentials', ca: 2, spec: ['2.21'], acts: ['2b', '1b'],
    lede: 'The five basic controls the National Cyber Security Centre recommends for every organisation, and how they map onto Task 2B.',
    figs: [['ce5', 'The five Cyber Essentials controls.']],
    sec: [
      ['The five controls', '<ul><li><b>Firewalls and internet gateways:</b> restrict the flow of traffic.</li><li><b>Secure configuration:</b> give users only the functionality they need, removing unnecessary software and limiting web access.</li><li><b>User access control:</b> the right accounts with the right privileges.</li><li><b>Malware protection:</b> up-to-date anti-malware and regular scans.</li><li><b>Security update management:</b> keeping systems and software patched.</li></ul>'],
      ['Applying and monitoring them', '<p>Cyber Essentials is not set up once and forgotten. Each control is applied, then monitored: checking firewall rules still make sense, accounts are still needed, definitions are current and updates are installed.</p>'],
      ['Cyber Essentials and Task 2B', '<p>Four of the five Task 2B requirements line up with Cyber Essentials: the accounts are user access control, the anti-virus is malware protection, the IP block is a firewall rule, and keeping updates on is security update management. Saying so in your log is a strong justification.</p>']
    ],
    terms: [['Cyber Essentials', 'An NCSC scheme of five basic security controls.'], ['NCSC', 'National Cyber Security Centre, the UK’s cyber security authority.'], ['Secure configuration', 'Settings that remove anything a user does not need.'], ['User access control', 'Managing who has accounts and what they can do.'], ['Security update management', 'Keeping software patched and supported.']],
    quiz: [
      mt('Match each Task 2B requirement to its Cyber Essentials control.', [['Admin and standard accounts', 'User access control'], ['Anti-virus with updates', 'Malware protection'], ['Blocking an IP address', 'Firewalls and internet gateways'], ['Automatic Windows updates', 'Security update management']], 'Naming the control is a ready-made justification.'),
      mc('Removing software a user does not need is which control?', 'Secure configuration', ['User access control', 'Malware protection', 'Firewalls and internet gateways'], 'Secure configuration strips away what is not needed.', 1),
      mc('Which organisation runs Cyber Essentials?', 'The National Cyber Security Centre (NCSC)', ['The Information Commissioner’s Office', 'Microsoft', 'The Computer Misuse Unit'], 'The NCSC is the UK authority behind the scheme.', 1),
      mc('Why do the controls need monitoring after they are applied?', 'Accounts, threats and software keep changing', ['The controls switch themselves off each month', 'Monitoring is only needed for large companies', 'Applying them once is always enough'], 'A control that was right last year may not be right now.', 2),
      mc('Which justification in a 2B log uses Cyber Essentials well?', 'The standard account applies user access control: daily work without admin rights', ['I followed Cyber Essentials because it is good', 'Cyber Essentials says to have two accounts', 'This makes the computer fully Cyber Essentials certified by the NCSC straight away'], 'Name the control and what it achieves.', 3),
      mc('Which requirement for the library maps to malware protection?', 'Locked-down public PCs with Defender kept up to date', ['A keypad lock on the store cupboard', 'Frosted film on Window A', 'A café payment procedure'], 'Malware protection means up-to-date anti-malware and scanning.', 2)
    ],
    recall: [['Name the five Cyber Essentials controls.', ['Firewalls and internet gateways', 'Secure configuration', 'User access control', 'Malware protection', 'Security update management']], ['Map the Task 2B requirements to Cyber Essentials.', ['Accounts: user access control', 'Anti-virus: malware protection', 'IP block: firewalls', 'Updates: security update management']], ['Why must the controls be monitored?', ['Threats, accounts and software change', 'Rules and definitions go out of date']]],
    apply: [['2b', 'Name the Cyber Essentials control in each justification.', 'Blocking the address is a boundary firewall control: it restricts the traffic the laptop accepts and sends.'], ['1b', 'Cyber Essentials is a checklist for your technical requirements.', 'Every library PC gets Defender with automatic updates: malware protection and security update management.']] },

  { id: 'backup', title: 'Backups and disaster recovery', ca: 2, spec: ['2.23', '1.11', '1.12'], acts: ['2b', '1b'],
    lede: 'Why backups exist, how to choose their frequency, source and destination, the main types, and how a disaster recovery plan uses them.',
    figs: [['backupTypes', 'Full, incremental and differential backups over a week.']],
    sec: [
      ['Purpose and criteria', '<p>A backup keeps an up-to-date copy of data so it can be restored after a disaster or a partial loss. Decide its <b>frequency</b> (daily, weekly, monthly), its <b>source</b> (which files or data), its <b>destination</b> (an internal or external location) and its <b>storage</b> (the media it sits on).</p>'],
      ['Types of backup', '<ul><li><b>Full:</b> everything, every time. Simple to restore, slow and large.</li><li><b>Incremental:</b> only what changed since the last backup of any kind. Fast and small, but a restore needs every piece.</li><li><b>Differential:</b> everything changed since the last full backup. Grows during the week; a restore needs the full plus the latest differential.</li></ul><p>Good practice keeps at least one copy away from the original, so one fire, flood or ransomware attack cannot take both.</p>'],
      ['Disaster recovery plans', '<p>A DRP is a formal document saying how to respond to unplanned events such as natural disasters, power outages and cyber attacks. It reduces the mean time to recovery, interruptions, damage and cost, and sets out alternative ways of working. Putting one in place starts with defining the scope (the environmental or technical impact, and the impact on the organisation, departments and individuals) and gathering information such as past outages.</p>']
    ],
    terms: [['Full backup', 'A complete copy of everything selected.'], ['Incremental backup', 'Only changes since the last backup of any kind.'], ['Differential backup', 'All changes since the last full backup.'], ['Backup destination', 'Where the copy is stored.'], ['DRP', 'Disaster recovery plan: how to respond to and recover from disruption.']],
    quiz: [
      mc('Which backup type copies only what changed since the last backup of any kind?', 'Incremental', ['Differential', 'Full', 'Mirror'], 'Differential is measured from the last full backup instead.', 1),
      mc('A full backup runs on Sunday with differentials on weekdays. Which do you need to restore Thursday’s data?', 'Sunday’s full and Thursday’s differential', ['Every backup from Sunday to Thursday', 'Only Thursday’s differential', 'Only Sunday’s full backup'], 'Each differential holds everything since the full.', 2),
      ms('Select the two backup criteria from spec point 2.23.', ['Frequency', 'Destination'], ['Colour', 'Brand of drive'], 'Frequency, source, destination and storage.'),
      mc('Why keep a backup copy away from the original?', 'So one fire, flood or ransomware attack cannot destroy both', ['So the backup runs faster at night', 'Because backups must never, ever be on the same network as the data', 'So nobody can ever restore the data'], 'Distance protects against the same disaster hitting both.', 2),
      mc('Which belongs in defining the scope of a DRP?', 'How the disaster affects the organisation, departments and individuals', ['Choosing the colour scheme for the plan', 'Buying brand new computers for every member of staff in every department', 'Deleting old backups to free space'], 'Scope means understanding the impact at each level.', 2),
      mc('The home-working laptop backs up daily at 19:00. What does that mean for data loss?', 'At most about a day’s work could be lost', ['No data can ever be lost', 'A week of work could be lost', 'Only the backups themselves could be lost'], 'Frequency sets the recovery point.', 3)
    ],
    recall: [['What are the four backup criteria?', ['Frequency', 'Source', 'Destination', 'Storage']], ['Compare full, incremental and differential backups.', ['Full: everything each time', 'Incremental: changes since the last backup of any kind', 'Differential: changes since the last full']], ['What is a DRP and why is it important?', ['Formal plan for responding to unplanned events', 'Reduces MTTR, disruption, damage and cost', 'Sets out alternative ways of working']]],
    apply: [['2b', 'Your backup justification should cover frequency, source, destination and timing.', 'Daily at 19:00, the user’s folders, to a separate backup disk: at most a day lost, and it runs after the working day.'], ['1b', 'Backups are a corrective control in your requirements, and a DRP is an administrative one.', 'Nightly encrypted backups of member records to an off-site location, with a DRP tested each year.']] }
];

function stepsFig(steps, label, icons) {

  rows.forEach((r, i) => {

    o += `<rect x="50" y="${y}" width="302" height="${h}" rx="10" class="d-box ${cls[i % cls.length]}"/><circle cx="26" cy="${cy}" r="15" class="d-box c5"/>` + tc(26, cy, String(i + 1), 'd-t d-b');

    y += h + 10;
  });
  return svg(360, y - 4, o, label);
}

  /* ---------- sample model answers: generated Packet Tracer configuration and 2B log ---------- */

  }

  /* ---------- report a problem: builds a message for students to send on Teams ---------- */

  }

  /* ---------- add read-aloud and report buttons to whatever screen is showing ---------- */

      else if (/^#\/task\/\d$/.test(h)) { ref = 'Task ' + h.split('/')[2] + ' overview'; read = '.banner h1, .lede, .must'; }
      else if (/^#\/project/.test(h)) { ref = 'How the project works'; read = '.banner h1, .lede, .must'; }

    } finally { decorate.busy = false; }
  }
  new MutationObserver(decorate).observe(app, { childList: true });

  /* ---------- routing and events ---------- */
  function setNav(a) {
    document.querySelectorAll('.nav a').forEach(l => { if (l.dataset.nav === a) l.setAttribute('aria-current', 'page'); else l.removeAttribute('aria-current'); });
  }
  function route() {
    setDistrict();
    { const a0 = (location.hash.replace(/^#\/?/, '').split('/')[0]) || ''; if ((a0 === 'project' || a0 === 'planner') && !P.start[a0]) { P.start[a0] = Date.now(); save(); } }
    applyA11y();
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    const [a, b] = parts;
    setNav(a === 'planner' ? 'planner' : a === 'settings' ? 'settings' : ['knowledge', 'topic', 'checklist'].includes(a) ? 'knowledge' : !a ? 'home' : '');
    if (a === 'project') return viewProject();
    if (a === 'task') return viewTask(+b);
    if (a === 'act') return viewAct(b, parts[2]);
    if (a === 'practice') { if (SET_BY[b]) return startSet(b); return viewHome(); }

    if (a === 'mocks') return viewMocks(b);

    if (a === 'samples') return viewSamples();
    if (a === 'sample') return viewSample(b, parts[2]);
    if (a === 'knowledge') return viewKnowledge(b);
    if (a === 'topic') return viewTopic(b, parts[2]);
    if (a === 'checklist') return viewChecklist(['red', 'amber', 'green', 'none'].includes(b) ? b : '');
    if (a === 'planner') return viewPlanner(b);
    if (a === 'share') return viewShare();
    if (a === 'teacher') { TV = null; return viewTeacher(); }
    if (a === 'settings') return viewSettings();

    return viewHome();
  }

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    if (QZ && ['opt', 'spot', 'place', 'unplace', 'qcheck', 'qnext', 'qretry', 'qagain'].includes(act) && quizAct(act, el)) return;
    if (act === 'wrisk') { const w = el.closest('.wrisk'); w.dataset[el.dataset.k] = el.dataset.v; w.querySelectorAll('[data-k="' + el.dataset.k + '"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); updRisk(w); return; }

    if (act === 'krate') { const r = P.recall[el.dataset.id] = P.recall[el.dataset.id] || {}; r[el.dataset.k] = +el.dataset.v; P.seen['r-' + el.dataset.id] = Date.now(); logAct('recall'); save(); const y = window.scrollY; viewTopic(el.dataset.id, 'recall'); window.scrollTo(0, y); const m = $('#km' + el.dataset.k); if (m) { m.hidden = false; const bt = document.querySelector('[data-act="kreveal"][data-k="' + el.dataset.k + '"]'); if (bt) { bt.textContent = 'Hide the model answer'; bt.setAttribute('aria-expanded', 'true'); } } const f = document.querySelector('[data-act="krate"][data-k="' + el.dataset.k + '"][data-v="' + el.dataset.v + '"]'); if (f) f.focus({ preventScroll: true }); return; }
    if (act === 'rag') { if (P.check[el.dataset.id] === el.dataset.v) delete P.check[el.dataset.id]; else P.check[el.dataset.id] = el.dataset.v; save(); const y = window.scrollY, h = location.hash.split('/')[2] || ''; viewChecklist(h); window.scrollTo(0, y); const f = document.querySelector('[data-act="rag"][data-id="' + el.dataset.id + '"][data-v="' + el.dataset.v + '"]'); if (f) f.focus({ preventScroll: true }); return; }
    if (act === 'fcshow') { FC.show = true; drawFlash(); const y = document.querySelector('[data-act="fcyes"]'); if (y) y.focus({ preventScroll: true }); return; }
    if (act === 'fcyes' || act === 'fcno') { fcMark(act === 'fcyes'); return; }
    if (act === 'sampopen') { P.samp[el.dataset.k] = Date.now(); save(); const y = window.scrollY; route(); window.scrollTo(0, y); return; }
    if (act === 'huntopen') { P.huntOpen[el.dataset.k] = Date.now(); save(); viewScenario(el.dataset.k); return; }
    if (act === 'preplan') { delete P.plan[weekStart(dayNum())]; save(); viewPlanner(); return; }
    if (act === 'usetdate') { delete P.mdates[el.dataset.n]; delete P.plan[weekStart(dayNum())]; save(); viewPlanner('dates'); return; }
    if (['mkcode', 'mkbackup', 'copy', 'restore'].includes(act)) { shareAct(act, el); return; }

    if (act === 'tlmake') { makeTabLinks(); return; }

    if (act === 'rpmake') { reportMake(el); return; }

  app.addEventListener('change', e => {

    if (el.dataset && el.dataset.hunt) { const sk = el.dataset.hunt, k = +el.dataset.k, l = P.hunt[sk] = (P.hunt[sk] || []).filter(x => x !== k); if (el.checked) l.push(k); P.huntOpen[sk] = Date.now(); logAct('hunt'); save(); const y = window.scrollY; viewScenario(sk); window.scrollTo(0, y); const f = document.querySelector('[data-hunt="' + sk + '"][data-k="' + k + '"]'); if (f) f.focus({ preventScroll: true }); return; }

  });
  app.addEventListener('keydown', e => { const el = e.target; if (e.key === 'Enter' && el.dataset && el.dataset.search) { e.preventDefault(); const b = app.querySelector('[data-act="gosearch"][data-for="' + el.id + '"]'); if (b) b.click(); } });
  app.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.search === 'live') { const v = el.value; $('#sres').innerHTML = resultsHtml(v); history.replaceState(null, '', '#/search/' + encodeURIComponent(v)); return; } if (el.dataset && ['reg', 'sur', 'ini'].includes(el.dataset.ed)) { P.ed[el.dataset.ed] = el.value; save(); const reg = (P.ed.reg || '').trim(), tail = (reg || 'REGNO') + '_' + ((P.ed.sur || '').trim() || 'Surname') + '_' + ((P.ed.ini || '').trim().slice(0, 1).toUpperCase() || 'X'); app.querySelectorAll('.fnames code').forEach((c, i) => { c.textContent = FILES[i][1] + '_' + tail + '.' + FILES[i][2]; }); return; } if (el.dataset && el.dataset.act === 'wcvss') { updCvss(el); return; } if (el.dataset && el.dataset.rans) { P.ans['r-' + el.dataset.rans + '-' + el.dataset.k] = el.value; save(); return; } if (QZ && el.id === 'cmdin' && !QZ.checked) { QZ.resp = el.value; const b = $('[data-act="qcheck"]'); if (b) b.disabled = !canCheck(); } });
  app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'cmdin' && QZ) { e.preventDefault(); if (!QZ.checked && canCheck()) quizAct('qcheck'); else if (QZ.checked) quizAct('qnext'); } });
  window.addEventListener('hashchange', route);
  route();

  window.OSP = { SEARCH: q => searchRun(q).map(e => [e.type, e.title, e.url]), DIST: districtFor, READY: n => readiness(n), WIS: WISSUES, CATS, SAMP: SAMPLES, P: () => P, KEY, W: { level, cvssBand, caFlowMatrix }, TERMS: () => TERMS, Q: { prep, mark, cmdOk, normCmd, KW, correctText }, SETS, KNOW, topicState: id => topicState(K_BY[id]), stampHtml: (a, b, c) => stampHtml(a, b, c), shuffle, events, upcoming, phases, focusTask, planTasks, planFor, FL: { dayNum, weekStart }, SH: { makeCode, readCode, makeBackup, readBackup, summary }, TASKS, ACTS, ACT_ORDER, FOCUS, SPEC, logAct };
})();
