    figs: [['raCycle', 'The security risk assessment process from spec point 2.16.'], ['factors', 'Where threats come from.'], ['matrix', 'Likelihood times severity gives the risk score.']],
    sec: [
      ['The security risk assessment process', '<ol><li>Identify the risks that might occur.</li><li>Assess each with a scoring matrix: likelihood (how probable) times severity (impact on the organisation) gives a risk score or RAG rating.</li><li>Weigh the asset’s value against the controls available.</li><li>Choose controls that are proportionate to the risk and the value.</li><li>Record the findings.</li><li>Review and test the controls regularly.</li></ol>{{widget:risk}}'],
      ['Vulnerability assessments', '<p>First <b>scope</b> it: which systems, services and networks are included, what access is needed, and what they will be tested against. Then <b>identify</b> vulnerabilities from scans and logs, <b>analyse</b> whether each can be exploited and how severe it is, and <b>prioritise</b> the risks. Finally <b>remediate</b> (update or remove the affected hardware or software) or <b>mitigate</b> (apply countermeasures, close what you can and escalate what still poses a threat).</p>'],
      ['Four kinds of infrastructure assessment', '<ul><li><b>Host based:</b> workstations and servers, their settings and patch history.</li><li><b>Network based:</b> attacks and vulnerable systems across the network.</li><li><b>Wireless based:</b> rogue access points and insecure wireless settings.</li><li><b>Application based:</b> flaws in software and web apps, such as SQL injection.</li></ul>'],
      ['Critical systems', '<p>A <b>single point of failure</b> is anything everything else depends on, such as one router. A <b>mission essential function</b> is something the organisation must keep doing, or restore fast, after a disruption, such as taking payments.</p>'],
      ['Where threats come from', '<p><b>Environmental:</b> power failures and spikes, natural disasters, fire, equipment failure and flooding. <b>Manmade:</b> internal (malicious or careless staff, human error, a misconfigured firewall) or external (malware, attacks, social engineering, terrorism). Covering both is how a risk assessment shows range.</p>']
    ],
    terms: [['Scope', 'What an assessment includes and what it tests against.'], ['Remediation', 'Removing a vulnerability by updating or replacing the cause.'], ['Mitigation', 'Reducing a risk with countermeasures when it cannot be removed.'], ['Single point of failure', 'One part that, if it fails, stops everything depending on it.'], ['Mission essential function', 'A function that must continue or be restored quickly.'], ['Rogue access point', 'An unauthorised wireless access point on the network.'], ['RAG rating', 'Red, amber or green, showing how urgent a risk is.']],
    quiz: [
      mc('According to spec point 2.16, how is a risk score calculated?', 'Likelihood × severity', ['Likelihood + severity + asset value', 'Asset value ÷ cost of controls', 'Severity alone, when it is high'], 'Likelihood times severity gives the score, which becomes a RAG rating or risk level.', 1),
      mc('Which kind of assessment would find a rogue access point?', 'Wireless based', ['Host based', 'Application based', 'A review of the backup schedule'], 'Wireless assessments look for unauthorised access points and weak wireless settings.', 1),
      sort('Sort each threat source.', ['Environmental', 'Manmade internal', 'Manmade external'], [['A power spike damages the switch', 0], ['A technician leaves a firewall rule wide open', 1], ['A ransomware email from an unknown sender', 2], ['Flooding in a basement server room', 0], ['An employee copies files before leaving', 1]], 'Internal threats come from inside the organisation, including honest mistakes.'),
      ord('Put the stages of a vulnerability assessment in order.', ['Scope the systems and the tests', 'Identify vulnerabilities from scans and logs', 'Analyse whether each can be exploited', 'Prioritise the risks', 'Remediate or mitigate, and escalate what remains'], 'Scope first, so you know what you are allowed to test and against what.'),
      mc('The library has one router. Why is it a single point of failure?', 'If it fails, everything depending on it stops', ['It is the device most likely to be attacked first', 'It is the only device that needs a password', 'It failed once already earlier this year'], 'A single point of failure is about dependence, not how often it is attacked.', 2),
      mc('For the climbing centre, which is a mission essential function?', 'Recording auto-belay checks so the walls stay open safely', ['Showing party videos on the smart TV for children’s birthday guests', 'Letting members charge their phones in the café', 'Displaying the café menu on a large screen'], 'Without safety records the centre cannot keep climbing open. The others are nice to have.', 3)
    ],
    recall: [['List the steps of a security risk assessment from 2.16.', ['Identify risks', 'Score likelihood × severity (RAG or risk level)', 'Weigh asset value against controls', 'Choose proportionate controls', 'Record findings', 'Review and test regularly']],
      ['What is the difference between remediation and mitigation?', ['Remediation removes the cause, for example updating or removing the affected software', 'Mitigation reduces the risk with countermeasures when the cause stays', 'Anything still dangerous is escalated']],
      ['Give the two groups of threat factors in 2.14, with two examples each.', ['Environmental: power failure, flooding, fire, natural disaster', 'Manmade internal: human error, misconfigured firewall', 'Manmade external: malware, social engineering']]],
    apply: [['1a', 'This is the process behind your whole risk assessment. Covering environmental and manmade threats, and both internal and external ones, gives you range.', 'R2 in the worked example scores likelihood 3 × severity 4 = 12: High.'], ['1b', 'Proportionate controls: the response should fit the risk score and the value of the asset.', 'A keypad lock for a High risk to the router, not round-the-clock security guards.']] },

  { id: 'measure', title: 'Measuring risk and impact', ca: 2, spec: ['2.7', '2.12', '2.15'], acts: ['1a', '3'],
    lede: 'What an exploited weakness can do to an organisation, and the words and numbers used to measure risk, recovery and reliability.',
    figs: [['ale', 'A quantitative measure: annual loss expectancy.'], ['rpo', 'Recovery point and recovery time objectives.']],
    sec: [
      ['Impacts of an exploited vulnerability', '<ul><li>Damage to property and resources, including through control systems.</li><li>Financial loss from being unable to trade normally.</li><li>Reputational damage and lost customer trust.</li><li>Fines or prosecution, for example from the ICO after a data breach.</li><li>Operational disruption to day-to-day work.</li><li>Harm to employees: physical, or psychological when their data is exposed.</li><li>Identity theft, such as loans taken out in a person’s name.</li></ul>'],
      ['Qualitative: words and colours', '<p>Non-numeric ratings. <b>Red</b> is high risk needing action now, <b>amber</b> is moderate and must be watched closely, <b>green</b> is low with no immediate action. Your 1A likelihood words and risk levels are qualitative.</p>'],
      ['Quantitative: numbers', '<p>Measuring effects in numbers, such as cost overruns or resource use. <b>SLE × ARO = ALE</b>: the cost of one incident times how many times a year it is expected gives the expected loss per year. <b>CVSS</b> scores vulnerabilities from 0 to 10.</p>'],
      ['Analysis tools', '<ul><li><b>Fault tree analysis:</b> a diagram tracing the causes of a system failure.</li><li><b>FMECA:</b> failure mode, effects and criticality analysis, looking at causes of failure and their effect on production, safety, cost and quality.</li><li><b>CRAMM:</b> a three-stage method that scopes, evaluates, then recommends countermeasures.</li></ul>'],
      ['Recovery and reliability measures', '<ul><li><b>RTO</b>, recovery time objective: how long until systems are usable again.</li><li><b>RPO</b>, recovery point objective: how much data can be lost.</li><li><b>MTBF</b>, mean time between failures: how often an asset is expected to fail.</li><li><b>MTTD</b>, mean time to detect: how quickly problems are spotted.</li><li><b>MTTR</b>, mean time to recovery: the average time to restore a failed system.</li></ul>']
    ],
    terms: [['SLE', 'Single loss expectancy: the cost of one incident.'], ['ARO', 'Annual rate of occurrence: expected incidents per year.'], ['ALE', 'Annual loss expectancy: SLE × ARO.'], ['CVSS', 'A 0 to 10 score for how serious a vulnerability is.'], ['RTO', 'How long until systems work again.'], ['RPO', 'How much data you could lose.'], ['MTTR', 'Average time to restore a failed system.'], ['Fault tree analysis', 'A diagram tracing the causes of a failure.']],
    quiz: [
      mc('A tablet worth £400 is lost about twice a year. What is the annual loss expectancy?', '£800', ['£200', '£400', '£402'], 'ALE = SLE × ARO = £400 × 2 = £800.', 2),
      mt('Match each measure to what it tells you.', [['RTO', 'How long until systems work again'], ['RPO', 'How much data could be lost'], ['MTBF', 'How often an asset is expected to fail'], ['MTTD', 'How quickly problems are spotted'], ['MTTR', 'Average time to restore a failed system']], 'Recovery objectives are targets set in advance; the mean times are measured from experience.'),
      mc('In a RAG rating, what does amber mean?', 'A moderate risk to watch closely', ['A high risk that needs action straight away', 'A low risk needing no action at the moment', 'A risk that has already happened'], 'Red is act now, amber is watch closely, green is no immediate action.', 1),
      ms('Select the two quantitative methods.', ['ALE = SLE × ARO', 'A CVSS score of 8.1'], ['Rating a risk amber because it is moderate', 'Describing the impact as “severe”', 'Ranking risks as high, medium or low'], 'Quantitative means numbers. Words and colours are qualitative.'),
      mc('Which impact would score best in a risk assessment for the physio clinic?', 'Patients’ health records exposed: a reportable breach, a possible ICO fine and lost trust', ['Data would be lost and the clinic would be in trouble with the law', 'The impact is high because it would be a very bad thing for any clinic', 'Financial loss, reputational damage, fines, disruption and identity theft for everyone'], 'Name what is exposed, then follow the harm through to this organisation. A list of every impact is not tied to the scenario.', 3),
      mc('In Task 3 you note that backups only run weekly. Which measure helps you judge whether that is good enough?', 'The recovery point objective (RPO)', ['Mean time between failures (MTBF)', 'The annual rate of occurrence (ARO)', 'The CVSS base score'], 'The RPO sets how much data the organisation can afford to lose, which is what backup frequency controls.', 3)
    ],
    recall: [['List five impacts an exploited vulnerability can have on an organisation.', ['Damage to property and resources', 'Financial loss', 'Reputational damage', 'Fines or prosecution, such as from the ICO', 'Operational disruption', 'Harm to employees; identity theft']],
      ['Explain the difference between RTO and RPO with an example.', ['RTO: time to get systems working again, such as four hours', 'RPO: how much data can be lost, such as one day since the last backup']],
      ['Compare qualitative and quantitative risk analysis.', ['Qualitative: words and colours, such as a RAG rating', 'Quantitative: numbers, such as ALE = SLE × ARO or a CVSS score']]],
    apply: [['1a', 'Your impact column draws on the list of impacts here, and your risk level is a qualitative rating.', 'Card payments stop, so the café loses income until the reader is replaced: financial loss and operational disruption.'], ['3', 'The recovery measures give you a way to judge your own decisions, such as how often backups run.', 'A weekly backup means up to a week of data could be lost, which may not meet the clinic’s RPO.']] },

  { id: 'vulns', title: 'Vulnerability assessment, CVE and mitigations', ca: 2, spec: ['2.5', '2.6'], acts: ['1a', '1b'],
    lede: 'How published vulnerabilities are identified and scored, and what to weigh up before recommending a fix.',
    figs: [['cvss', 'CVSS bands and the parts of a CVE identifier.']],
    sec: [
      ['CVE', '<p>Common Vulnerabilities and Exposures is a public list of known vulnerabilities. Each has an identifier such as CVE-2024-3400: the year the number was assigned, then its own number. Entries are published by vendors, researchers and penetration testers.</p>'],
      ['CVSS', '<p>The Common Vulnerability Scoring System rates a vulnerability from 0 to 10, based on its impact, how easy it is to exploit and its severity. Low is under 4, medium 4 to 6.9, high 7 to 8.9 and critical 9 to 10.</p>{{widget:cvss}}'],
      ['Using CVE in an assessment', '<ol><li>Find the published CVEs that affect your systems.</li><li>Research each one: use its CVSS score in your risk assessment.</li><li>Identify which systems are affected.</li><li>Identify the mitigations.</li><li>Put the suggested mitigations in place.</li></ol>'],
      ['Before recommending a mitigation', '<p>Weigh up the risk and its impact on the business; what led to the weakness; the cost of fixing it and of not fixing it; the type and severity of the vulnerability; the people, money and technology available; deadlines and reporting duties; priority based on the CVE score; the possible responses; and any proof-of-concept results that confirm the flaw. Then write the recommendation clearly, in terms the reader understands.</p>']
    ],
    terms: [['CVE', 'A public identifier for a known vulnerability.'], ['CVSS', 'A 0 to 10 severity score for a vulnerability.'], ['Exploit', 'A way of taking advantage of a vulnerability.'], ['Patch', 'An update that fixes a vulnerability.'], ['Proof of concept', 'A safe test showing a flaw is real.']],
    quiz: [
      mc('A vulnerability has a CVSS score of 9.3. Which band is it in?', 'Critical', ['High', 'Medium', 'Low'], 'Scores of 9 to 10 are critical.', 1),
      mc('What does a CVE identifier such as CVE-2024-3400 tell you?', 'Which known vulnerability it is, and the year its number was assigned', ['How severe the vulnerability is on a scale of 0 to 10', 'Which company first discovered the vulnerability, and when it was finally fixed', 'How many organisations have been attacked using it'], 'The ID names the vulnerability. Severity comes from its CVSS score.', 2),
      ord('Put the CVE technique in order.', ['Find published CVEs for your systems', 'Check each CVSS score', 'Identify the systems affected', 'Identify the mitigations', 'Put the mitigations in place'], 'Find, score, scope, plan the fix, then fix it.'),
      ms('Select the two factors spec point 2.6 says to weigh before recommending a fix.', ['The cost of fixing it, and of not fixing it', 'The people, money and technology available'], ['Which member of staff happened to report it first', 'Whether the vendor is a well-known brand name', 'Whether the fix makes the network look tidier'], 'Cost and resources decide what is realistic for the organisation.'),
      mc('A scan finds the climbing centre’s camera has a critical CVE and no patch yet. Which recommendation fits best?', 'Move the camera to its own VLAN and block its internet access until a patch is out', ['Accept the risk because no patch exists yet', 'Replace every device on the network straight away, including all the PCs and the tills', 'Ignore it, because cameras do not hold personal data'], 'With no patch, mitigate: isolate the device and limit what an attacker could reach.', 3),
      mc('Where can a CVSS score help in a risk assessment?', 'As evidence for the likelihood and impact you give a software risk', ['As the title for the risk, written at the very top of the threat column', 'Instead of writing out an impact at all', 'Only in the Packet Tracer file for 1C'], 'A published score supports your judgement. It never replaces the written impact.', 2)
    ],
    recall: [['What is the difference between CVE and CVSS?', ['CVE: an identifier for a known vulnerability', 'CVSS: a 0 to 10 score for how serious it is']],
      ['List the five steps of using CVE to evaluate a vulnerability assessment.', ['Find published CVEs', 'Check CVSS scores', 'Identify affected systems', 'Identify mitigations', 'Implement them']],
      ['Give four factors to weigh before recommending a mitigation.', ['Risk and business impact', 'Cost of fixing and not fixing', 'Severity and type', 'Resources available', 'Timeframes and reporting duties', 'Proof-of-concept results']]],
    apply: [['1a', 'Out-of-date software is a vulnerability. If a known CVE exists, its score supports your likelihood and impact.', 'The anaesthetic PC runs an old operating system with critical unpatched CVEs, so likelihood is High.'], ['1b', 'Recommend mitigations that fit the organisation’s money, people and timescales.', 'Isolate devices that cannot be patched on their own VLAN until an update is available.']] },

  { id: 'controls', title: 'Security controls and risk responses', ca: 1, spec: ['1.13', '1.14', '1.15', '1.16', '2.18'], acts: ['1b'],
    lede: 'The three kinds of control, physical, technical and procedural examples of each, and the four ways to respond to a risk.',
    figs: [['ctrlTime', 'Controls by when they act.'], ['responses', 'Four responses to any risk.'], ['layers', 'Layering controls so one failing does not leave the asset exposed.']],
    sec: [
      ['Preventative controls', '<p>Stop unauthorised access or tampering, and guard against environmental events.</p><ul><li><b>Physical:</b> anti-pick locks; fences, bollards, gates and cages; flood and fire defences; managed entry such as a staffed reception, guards, restricted doors and card readers; biometrics such as face or fingerprint; CCTV; PINs and passcodes.</li><li><b>Technical:</b> firewalls, allow and deny lists, sandboxing, and device hardening: changing default passwords, correct file and service permissions, updates, removing unneeded software, applying security policies and disabling unauthorised devices such as USB sticks.</li><li><b>Procedural:</b> separation of duties and role-based access control (RBAC).</li></ul>'],
      ['Corrective controls', '<p>Limit the damage and stop it happening again.</p><ul><li><b>Physical:</b> fire suppression (sprinklers, extinguishers) and gas suppression (inert or chemical).</li><li><b>Technical:</b> patching, disconnecting infected systems and quarantining a virus.</li><li><b>Procedural:</b> standard operating procedures, such as what to do when a fire is found, and the disaster recovery plan.</li></ul>'],
      ['Compensating controls', '<p>A safeguard if the main control fails.</p><ul><li><b>Physical:</b> segregation of duties; logging who enters a location, for example key code records.</li><li><b>Technical:</b> encryption.</li><li><b>Procedural:</b> mandatory awareness training, regular testing of controls such as simulated attacks, and SOPs such as environmental monitoring.</li></ul>'],
      ['Applying controls', '<p>Review the risk using information from systems and users, such as logs and security events. Choose controls in proportion to the risk. Stay within the law and policy, such as the Data Protection Act 2018 and the organisation’s data protection policy.</p>'],
      ['Four risk responses', '<ul><li><b>Accept:</b> live with the risk when nothing more can be done, or what remains after controls is acceptable.</li><li><b>Transfer:</b> pass it to another party, such as an insurer or a specialist supplier.</li><li><b>Avoid:</b> change the plan so the risk no longer exists.</li><li><b>Mitigate:</b> add controls to reduce likelihood or severity.</li></ul>']
    ],
    terms: [['Preventative control', 'Stops an incident happening.'], ['Corrective control', 'Limits damage after an incident.'], ['Compensating control', 'Protects if the main control fails.'], ['Device hardening', 'Reducing a device’s weaknesses through its settings.'], ['Sandboxing', 'Running untrusted code somewhere it cannot harm the system.'], ['RBAC', 'Role-based access control: permissions given by job role.'], ['Separation of duties', 'Splitting a task so no one person can misuse it alone.'], ['Risk transfer', 'Passing a risk to someone else, such as an insurer.']],
    quiz: [
      sort('Sort each control by type.', ['Preventative', 'Corrective', 'Compensating'], [['Card reader on the server room door', 0], ['Quarantining a file the antivirus flagged', 1], ['Encrypting laptops in case one is stolen despite the locks', 2], ['Sprinklers in the store room', 1], ['Changing default passwords on the WAPs', 0], ['Logging every use of the door keypad', 2]], 'Preventative stops it, corrective deals with it afterwards, compensating covers a failed main control.'),
      mt('Match each risk response to what it means.', [['Accept', 'Live with the small risk left after controls'], ['Transfer', 'Pass the risk to a third party such as an insurer'], ['Avoid', 'Change the plan so the risk no longer exists'], ['Mitigate', 'Add controls to cut likelihood or impact']], 'Most requirements in 1B are mitigation. The others are worth naming in Task 3.'),
      mc('Which is an example of device hardening?', 'Removing software the device does not need', ['Fitting a lockable cage around the switch', 'Writing an acceptable use policy for staff', 'Buying cyber insurance for the business'], 'Hardening changes the device itself. The others are physical, procedural and transfer.', 1),
      mc('What makes a control compensating?', 'It protects the asset if the main control fails', ['It pays the organisation back after an attack', 'It is the cheapest control available for the risk', 'It is only applied after an incident is over'], 'Compensating controls are a back-up layer, not a refund.', 2),
      mc('The library decides not to offer printing from visitors’ phones at all. Which risk response is that?', 'Avoid', ['Accept', 'Transfer', 'Mitigate'], 'Removing the service removes the risk: avoidance.', 2),
      mc('Which pair gives the library’s store cupboard layered protection?', 'A keypad lock, plus a log of every code used', ['A keypad lock, and a second keypad lock', 'A poster on the door asking visitors and café staff to stay out', 'Moving the router to the café counter instead'], 'A preventative control plus a compensating one: if a code leaks, the log shows who used it.', 3)
    ],
    recall: [['Explain preventative, corrective and compensating controls, with two examples of each.', ['Preventative stops it: locks, firewalls, hardening', 'Corrective limits damage afterwards: sprinklers, patching, quarantine', 'Compensating backs up a failed control: encryption, entry logs, training']],
      ['Name the four risk responses and give an example of each.', ['Accept: tolerate a small leftover risk', 'Transfer: insurance', 'Avoid: stop offering the risky service', 'Mitigate: add controls']],
      ['What does device hardening include?', ['Change default passwords', 'Correct permissions on files and services', 'Install updates and fixes', 'Remove unnecessary software', 'Apply security policies', 'Disable unauthorised devices such as USB sticks']]],
    apply: [['1b', 'The three tables in your requirements are physical, technical and administrative. Use preventative, corrective and compensating examples across them, so one failure never leaves an asset exposed.', 'Keypad lock (preventative) plus a log of codes used (compensating) on the store cupboard.'], ['3', 'Naming the risk response shows you evaluated your choices, for example accepting a small remaining risk.', 'I accepted the risk of a tablet being dropped, because its data is encrypted and backed up.']] },

  { id: 'netsec', title: 'Protecting network infrastructure', ca: 1, spec: ['1.3', '1.4'], acts: ['1b', '1c'],
    lede: 'Protecting hardware, operating systems and networks, and the principles for designing a network that is hard to compromise.',
    figs: [['zones', 'Putting public-facing services in a DMZ, separate from the internal network.'], ['topology', 'Segmentation in the worked library network.']],
    sec: [
      ['Hardware', '<ul><li><b>Hardware protection:</b> server and software solutions that protect hardware and data.</li><li><b>Device hardening:</b> updates and secure settings.</li><li><b>Physical controls:</b> secure locations, locked cages, CCTV and key card doors.</li></ul>'],
      ['Operating systems', '<ul><li><b>Updates and patches</b> fix security flaws. A system snapshot lets you <b>roll back</b> if a patch causes problems.</li><li><b>OS hardening</b> removes unneeded accounts, functions, applications, ports and access, and applies security policies.</li></ul>'],
      ['Networks', '<ul><li><b>Segmentation and isolation</b> separate networks, systems, data and devices so an attacker cannot move freely.</li><li><b>Network monitoring</b> tools watch traffic to catch attacks early.</li><li><b>Network hardening</b> secures the channels between devices.</li><li><b>Firewalls</b> control traffic using rules.</li></ul>'],
      ['Designing for security', '<p>Establish the context first: take a <b>zero trust</b> approach where every access is verified; decide the system’s purpose and what risk is acceptable; identify vulnerabilities and how users behave; agree suppliers’ roles; map where sensitive data is stored and used; and make security roles clear. Then <b>make compromise difficult</b>: validate and protect data, <b>reduce the attack surface</b>, keep controls reviewed and tested, protect management systems, use proven solutions, and audit every change.</p>']
    ],
    terms: [['VLAN', 'Virtual LAN: a separate network created on shared switches.'], ['ACL', 'Access control list: router rules that allow or block traffic.'], ['Zero trust', 'Verify every access request; trust nothing by default.'], ['Segmentation', 'Dividing a network so parts are isolated.'], ['Attack surface', 'All the points where an attacker could get in.'], ['DMZ', 'A zone for public-facing servers, kept apart from the internal network.'], ['Roll back', 'Returning a system to a snapshot taken before a change.'], ['OS hardening', 'Removing unneeded accounts, services, apps and ports.']],
    quiz: [
      mc('What does a zero trust approach mean?', 'Every request for access must be verified', ['No staff are ever trusted with admin passwords', 'The network has no firewall, so nothing is trusted', 'Only devices the organisation bought can connect'], 'Being inside the network earns no automatic trust.', 1),
      mc('Why does segmentation limit the damage from an attack?', 'An attacker in one segment cannot move freely into the others', ['It makes the whole network run faster for every user on every device', 'It hides the Wi-Fi network name from attackers', 'It stops any malware from being downloaded'], 'Segmentation contains an attacker, which is why VLANs feature in 1C.', 1),
      ms('Select the two examples of OS hardening.', ['Removing unused user accounts', 'Closing ports that are not needed'], ['Putting the server in a locked cage', 'Writing a backup policy for staff', 'Buying a faster network switch'], 'OS hardening changes the operating system itself.'),
      mc('An update breaks the booking software. What lets you undo it quickly?', 'Rolling back to a snapshot taken before the update', ['Running a full antivirus scan on the PC straight away, then restarting it', 'Changing all the user passwords at once', 'Moving the PC onto a different VLAN'], 'Snapshots before patching make roll back possible.', 2),
      mc('Which part of your Packet Tracer network shows segmentation?', 'Separate VLANs for staff, payments, public and guest devices', ['A console password set on every switch and every router in the building', 'WPA2 encryption set on each access point', 'Every device named to match the floor plan'], 'VLANs, enforced by the router ACL, are your segmentation.', 2),
      mc('Which requirement best reduces the attack surface of the public PCs?', 'Remove admin rights and unneeded software, and block USB storage', ['Add more public PCs so the queues are shorter', 'Move the public PCs closer to the windows', 'Let visitors install any software they need, so they stop asking staff for help'], 'Fewer accounts, programs and ports means fewer ways in.', 2)
    ],
    recall: [['What is zero trust, and why does it help?', ['Every access request is verified', 'Being on the network earns no trust', 'A compromised device cannot move freely']],
      ['Describe three ways of protecting a network.', ['Segmentation and isolation', 'Network monitoring', 'Network hardening', 'Firewalls controlling traffic by rules']],
      ['What does OS hardening involve, and why take a snapshot before patching?', ['Remove unneeded accounts, functions, apps, ports and access; apply policies', 'A snapshot allows roll back if a patch causes problems']]],
    apply: [['1b', 'Segmentation, hardening and firewalls are your strongest technical measures. Say where each goes and what it stops.', 'Separate VLANs with an ACL on the router stop guest Wi-Fi reaching the Till PC.'], ['1c', 'Your simulation is these principles made real: VLANs segment, the ACL is the firewall rule, shut ports reduce the attack surface.', 'Shutting Fa0/15 to Fa0/24 removes spare ways into the switch.']] },

  { id: 'crypto', title: 'Cryptography, encryption and certificates', ca: 1, spec: ['1.9', '1.17', '1.18', '1.19', '1.20', '2.22'], acts: ['1b', '1c'],
    lede: 'How cryptography protects data in transit and at rest, and how digital certificates prove who you are talking to.',
    figs: [['cryptoCore', 'Symmetric and asymmetric encryption, and hashing.'], ['certSteps', 'How a digital certificate is generated.']],
    sec: [
      ['Why cryptography', '<p>Use the <b>CIA triad</b> to decide what data needs. Encryption stops eavesdropping on data in transit, and cryptography gives four properties: <b>confidentiality</b> (only intended recipients can decrypt), <b>integrity</b> (changes are detected, for example with HMAC), <b>authenticity</b> (the receiver can check the sender with a digital signature) and <b>non-repudiation</b> (the sender cannot deny sending it).</p>'],
      ['Encryption and hashing', '<ul><li><b>Encryption</b> is reversible with the right key.</li><li><b>Symmetric:</b> one shared key encrypts and decrypts, such as in card payment systems. WPA2 Wi-Fi uses AES, a symmetric cipher.</li><li><b>Asymmetric:</b> a public key encrypts and only the matching private key decrypts. Used to send private data, as in encrypted email.</li><li><b>Hashing</b> is one way: a fixed-length output that cannot be reversed, used to store passwords.</li></ul>'],
      ['Encryption tools', '<ul><li><b>In transit:</b> TLS protects websites, email and messaging. SSL is the older, outdated protocol it replaced.</li><li><b>At rest:</b> full disk encryption protects everything on a device, for example if a laptop is stolen. File-based encryption protects individual files and folders, such as documents being shared.</li></ul>'],
      ['Digital certificates', '<p>A certificate proves the identity of a server, device or user using asymmetric cryptography. It holds the holder’s name, a unique serial number, an expiry date, the holder’s public key and the issuer’s signature. <b>Server</b> certificates let clients check a server, <b>client</b> certificates let a client prove itself to a server, and <b>code signing</b> certificates prove who wrote software and that it is unchanged.</p>'],
      ['Managing and generating certificates', '<p>Certificate management tools monitor expiry dates, revoke certificates early when needed, renew automatically, create, sign and issue certificates, audit where they are deployed and help diagnose problems. To generate one: create a key pair, create a certificate signing request (CSR), a trusted certificate authority (CA) signs and issues it, then install it.</p>']
    ],
    terms: [['WPA2', 'Wi-Fi security that encrypts wireless traffic, using AES.'], ['Symmetric encryption', 'One shared key encrypts and decrypts.'], ['Asymmetric encryption', 'A public key encrypts; only the private key decrypts.'], ['Hashing', 'One-way, fixed-length output that cannot be reversed.'], ['HMAC', 'A hash with a key that proves data was not changed.'], ['Non-repudiation', 'The sender cannot deny sending the message.'], ['TLS', 'The protocol that encrypts web, email and messaging traffic.'], ['Full disk encryption', 'Encrypts everything stored on a device.'], ['Certificate authority', 'A trusted body that signs and issues certificates.'], ['CSR', 'Certificate signing request sent to a CA.']],
    quiz: [
      mc('Which of these is one way and cannot be reversed?', 'Hashing', ['Symmetric encryption', 'Asymmetric encryption', 'Transport Layer Security'], 'Hashes cannot be turned back into the original, which is why they are used for stored passwords.', 1),
      ord('Put the steps for generating a digital certificate in order.', ['Generate a public and private key pair', 'Create a certificate signing request', 'A trusted CA signs and issues it', 'Install it on the server'], 'The CSR carries the public key to the CA, which signs it.'),
      mt('Match each property to what it guarantees.', [['Confidentiality', 'Only the intended reader can decrypt it'], ['Integrity', 'Changes in transit can be detected'], ['Authenticity', 'The receiver can check who sent it'], ['Non-repudiation', 'The sender cannot deny sending it']], 'Different tools give different properties: encryption, hashing and signatures.'),
      mc('A laptop with client files is stolen from a car. Which control stops the thief reading them?', 'Full disk encryption', ['A server-side certificate', 'TLS on the email server', 'Hashing the file names'], 'Data at rest on a stolen device needs full disk encryption.', 2),
      mc('In Packet Tracer, which setting protects guest Wi-Fi traffic from eavesdropping?', 'WPA2-PSK with AES', ['A hidden SSID with no passphrase', 'A console password on WAP1', 'An enable secret on the router'], 'WPA2 encrypts the wireless traffic with AES. Hiding the SSID protects nothing.', 2),
      mc('Which requirement uses encryption well for the café card payments?', 'Encrypt card data from reader to bank, with the reader on its own VLAN', ['Encrypt everything on the network so that it is all completely secure', 'Use SSL because it is the newest and strongest encryption protocol', 'Hash the card numbers so staff can read them back later on'], 'Specific, correct and placed. SSL is outdated, and hashes cannot be read back.', 3)
    ],
    recall: [['Compare symmetric and asymmetric encryption, with an example of each.', ['Symmetric: one shared key, such as card payments or WPA2 with AES', 'Asymmetric: public key encrypts, private key decrypts, such as encrypted email or TLS']],
      ['List the steps for generating a digital certificate.', ['Generate a key pair', 'Create a CSR', 'A trusted CA signs and issues it', 'Install it']],
      ['What does a digital certificate contain?', ['Holder’s name', 'Unique serial number', 'Expiry date', 'Holder’s public key', 'Issuer’s signature']]],
    apply: [['1b', 'Encryption measures belong in your technical table: say what is encrypted, where, and what it protects.', 'Full disk encryption on the clinic tablets, so a stolen tablet does not expose treatment notes.'], ['1c', 'WPA2 with AES on every access point is the encryption the task asks you to configure.', 'WAP1: SSID LIB-GUEST, WPA2-PSK, AES, a long passphrase.']] },

  { id: 'gov', title: 'Governance, frameworks and assurance', ca: 1, spec: ['1.1', '1.2', '1.10', '3.11'], acts: ['1b', '3'],
    lede: 'Who is responsible for security, the principles behind good IT governance, and the frameworks and standards organisations use.',
    figs: [['pdca', 'An ISMS keeps improving.'], ['frameworks', 'Frameworks and standards named in the specification.']],
    sec: [
      ['Why governance', '<p>Governance lets an organisation investigate, control, communicate and report cyber risks. It sets clear roles (such as <b>data controller</b> and <b>data processor</b>), policies (such as data retention and deletion) and security activities (such as evaluating new systems). It manages compliance with laws, frameworks and standards, such as ISO 27001, data protection and Freedom of Information requests, and keeps security aligned with business priorities.</p>'],
      ['IT governance principles', '<ul><li><b>Responsibility:</b> everyone knows their role, such as asset owner, data controller or data processor.</li><li><b>Strategy:</b> secure by design, planning for future needs such as cloud services.</li><li><b>Acquisition:</b> every purchase weighed for risks, benefits and costs.</li><li><b>Performance:</b> enough prevention and remedy to protect confidentiality, integrity and availability.</li><li><b>Conformance:</b> data used within the law and regulations.</li><li><b>Human behaviour:</b> policies consider people, not just technology.</li></ul>'],
      ['ISMS, frameworks and standards', '<p>An <b>information security management system</b> (ISMS) creates the policies, such as an information security policy and an acceptable use policy, that keep an organisation compliant. Frameworks help: <b>COBIT</b> for governing and managing IT, <b>SOC 2</b> for assessing security, availability, processing integrity, confidentiality and privacy controls, and <b>NIST</b> for improving how cyber risk is managed. Standards include the <b>ISO 27000</b> series, where <b>ISO 27001</b> is used to set up, run and continually improve an ISMS, and ISO/IEC 38500 for governing IT (the specification prints its number as 35800).</p>'],
      ['Information assurance and governance (IAG)', '<p>IAG guides how security strategies, policies and processes are developed and improved, supports auditing them, keeps them maintained through a compliance monitoring plan, and confirms compliance with standards such as ISO standards and the NIST framework.</p>']
    ],
    terms: [['Governance', 'How an organisation directs and controls security.'], ['ISMS', 'Information security management system: policies and processes for security.'], ['Data controller', 'Decides why and how personal data is processed.'], ['Data processor', 'Processes personal data on the controller’s behalf.'], ['ISO 27001', 'The standard for setting up and improving an ISMS.'], ['NIST', 'A framework for improving cyber risk management.'], ['Secure by design', 'Building security in from the start.']],
    quiz: [
      mt('Match each framework or standard to its use.', [['ISO 27001', 'Setting up and improving an ISMS'], ['NIST', 'Improving how cyber risk is managed'], ['COBIT', 'Governing and managing IT'], ['SOC 2', 'Assessing security and privacy controls']], 'The specification names these four. Knowing them gives Task 3 improvements something solid to point to.'),
      mc('Who decides why and how personal data is processed?', 'The data controller', ['The data processor', 'The ICO', 'The asset owner'], 'The controller decides; the processor acts on the controller’s instructions.', 1),
      mc('Weighing a new cloud booking system’s risks, benefits and costs before buying it is which governance principle?', 'Acquisition', ['Conformance', 'Performance', 'Human behaviour'], 'Acquisition covers evaluating purchases.', 2),
      mc('What does an ISMS produce?', 'Policies and processes that keep the organisation compliant', ['A list of every device on the network', 'A complete firewall rule set for the main router and every switch on site', 'An annual audit of the IT budget'], 'An ISMS is about policies and processes, not individual settings.', 1),
      mc('Which administrative requirement shows good governance?', 'Named roles: the branch manager owns member data and reviews access monthly', ['Fit a keypad lock to the store cupboard door', 'Set WPA2 with a long passphrase on both of the guest access points in the public areas', 'Disable the USB ports on the public PCs'], 'Governance is about responsibility and oversight. The others are physical and technical.', 2),
      mc('In Task 3, which suggested improvement links to a framework?', 'Map the requirements to ISO 27001 controls to find gaps', ['Add more rows so that the risk assessment is longer and looks more thorough', 'Change the colours used for the risk levels', 'Swap the floor plan for a more modern one'], 'Using a recognised standard to find gaps is a justified, professional improvement.', 3)
    ],
    recall: [['Give three purposes of information security governance.', ['Investigate, control, communicate and report cyber risks', 'Set roles, policies and activities', 'Manage compliance with law and standards', 'Align security with business priorities']],
      ['Name the six IT governance principles.', ['Responsibility', 'Strategy', 'Acquisition', 'Performance', 'Conformance', 'Human behaviour']],
      ['What is an ISMS, and which standard is used to set one up?', ['A system of policies and processes for information security', 'ISO 27001: establish, implement, maintain and improve it']]],
    apply: [['1b', 'Governance gives your administrative table substance: named roles, reviews and standards to follow.', 'The branch manager owns member data and reviews counter access every month.'], ['3', 'Frameworks give your improvements a recognised benchmark.', 'Checking the requirements against ISO 27001 would show that no one owns incident response.']] },

  { id: 'policy', title: 'Policies, compliance and security requests', ca: 2, spec: ['2.24', '2.25', '1.24'], acts: ['1b', '1a'],
    lede: 'The digital use policies an organisation needs, how compliance is monitored, and how to decide whether a security request is genuine.',
    figs: [['policies', 'Digital use policies in the specification.'], ['reqCheck', 'Checks before acting on a security request.']],
    sec: [
      ['Digital use policies', '<ul><li><b>Data protection:</b> how data is used, monitored and managed.</li><li><b>Acceptable use:</b> how networks and systems may be used.</li><li><b>Access control:</b> how access and permissions are managed.</li><li><b>Asset classification:</b> how much protection an asset gets, including access, disposal and recovery.</li><li><b>Information security:</b> requirements for using networks securely.</li><li><b>Incident response:</b> how the organisation responds to an incident.</li><li><b>Mobile device:</b> rules for connecting mobile devices.</li><li><b>Backup:</b> how backups are made to prevent data loss.</li><li><b>Bring your own device (BYOD):</b> rules for personal devices.</li></ul>'],
      ['Compliance and monitoring', '<p>A compliance and monitoring plan audits processes and policies so they stay current and improve; compares and checks processes, log files and incident reports for accuracy; and makes sure the organisation complies with ISO standards.</p>'],
      ['Is this security request valid?', '<p>Before acting, check the <b>origin</b> of the request, the <b>reason</b> for it, the <b>status and permissions</b> of the person asking (staff or outside), how <b>sensitive</b> it is (for example, does it expose personal data?), whether it adds <b>new risks</b>, and that handling it meets <b>regulations</b>. A phone call asking for a manager’s password to be reset should fail these checks until the caller is verified.</p>']
    ],
    terms: [['Acceptable use policy', 'Rules for how systems and networks may be used.'], ['Access control policy', 'How access and permissions are granted and managed.'], ['Asset classification', 'Deciding how much protection each asset needs.'], ['BYOD policy', 'Rules for staff using their own devices.'], ['Incident response procedure', 'The steps taken when an incident happens.'], ['Audit', 'A formal check that policies and processes are followed and current.']],
    quiz: [
      mt('Match each policy to its purpose.', [['Acceptable use', 'How networks and systems may be used'], ['Access control', 'How access and permissions are managed'], ['Asset classification', 'How much protection an asset gets'], ['Incident response', 'How to respond when something happens'], ['BYOD', 'Rules for staff using their own devices']], 'Each policy can be a row in your administrative table, with its own enforcement method.'),
      mc('An email “from the director” asks IT to give a new contractor admin rights today. What should IT check first?', 'That the request really came from the director, and why it is needed', ['That the contractor’s own laptop has antivirus installed and fully up to date', 'Whether a spare admin licence is available', 'How quickly the change could be completed today'], 'Origin and reason come first: urgent requests for access are a classic social engineering trick.', 2),
      ms('Select the two parts of a compliance and monitoring plan.', ['Audit policies so they stay up to date', 'Check logs against incident reports'], ['Buy the latest firewall model every year', 'Let staff choose their own password rules', 'Delete old log files to save storage space'], 'Auditing and checking for accuracy are what keep compliance real.'),
      mc('Which policy decides how much protection an asset receives?', 'Asset classification policy', ['Acceptable use policy', 'Backup policy', 'Mobile device policy'], 'Classification drives the strength of controls, access, disposal and recovery.', 1),
      mc('Which is a genuine enforcement method for an acceptable use policy?', 'Users accept it on screen before every log-in', ['The policy is written in clear, simple language', 'The policy explains why each rule matters', 'The policy is long and covers everything in detail'], 'Enforcement is how compliance is made to happen, not how the policy is written.', 2),
      mc('Climbing centre staff use their own phones for bookings, with no rules at all. Which risk does this suggest for 1A?', 'Member data leaks from unmanaged phones that are lost or shared', ['Phones may run out of battery during busy weekend sessions at the centre', 'Staff might take too many personal calls at work', 'Phones could be too slow for the booking website'], 'Unmanaged personal devices holding member data are a privacy and security risk, answered by a BYOD policy.', 3)
    ],
    recall: [['Name five digital use policies and what each one does.', ['Data protection: use of data', 'Acceptable use: use of systems', 'Access control: permissions', 'Asset classification: level of protection', 'Incident response, mobile device, backup, BYOD, information security']],
      ['What should you check before acting on a security request?', ['Origin', 'Reason', 'Requester’s status and permissions', 'Sensitivity', 'New risks introduced', 'Regulatory requirements']],
      ['What does a compliance and monitoring plan do?', ['Audits policies and processes to keep them current', 'Checks processes, logs and incident reports for accuracy', 'Ensures compliance with ISO standards']]],
    apply: [['1b', 'Policies fill your administrative table. Each needs a description, its impact and a real enforcement method.', 'BYOD policy: personal phones must use the booking app with a PIN and remote wipe; checked when staff join.'], ['1a', 'A missing policy is often the vulnerability behind a risk.', 'No BYOD policy, so member data sits on personal phones with no lock.']] },

  { id: 'law', title: 'Legislation and privacy breaches', ca: 1, spec: ['1.21', '2.11'], acts: ['1a', '1b'],
    lede: 'The laws that shape cyber security in the UK, and the threats to privacy with the ways to prevent them.',
    figs: [['laws', 'The laws named in the specification.']],
    sec: [
      ['The laws', '<ul><li><b>Data Protection Act 2018</b> (with UK GDPR): organisations must protect personal data from attack, detect security events and limit the impact of an incident. The Information Commissioner’s Office (ICO) enforces it and can fine.</li><li><b>Computer Misuse Act 1990:</b> makes it a crime to access computer material without authorisation, to do so intending a further crime, to modify or delete data without authorisation, and to make, supply or obtain tools for these offences.</li><li><b>Investigatory Powers Act 2016:</b> brings together the powers of police, security and intelligence agencies to obtain communications data, and how those powers are authorised and overseen.</li><li><b>Human Rights Act 1998:</b> protects human rights; all public bodies must follow it.</li><li><b>Telecommunications (Security) Act 2021:</b> public network providers must reduce the risk of compromise, remedy its effects and tell users when one happens.</li><li><b>Freedom of Information Act 2000:</b> gives access to information held by public bodies, with exemptions for security bodies such as the NCSC.</li></ul>'],
      ['Special category data', '<p>Some personal data, such as health information, is special category data under UK GDPR and needs extra protection. A breach of patient notes is more serious than a breach of opening hours.</p>'],
      ['Preventing privacy breaches', '<ul><li><b>Social engineering:</b> raise awareness of recent attacks.</li><li><b>Unmanaged devices:</b> policies so they are not used, and secure devices provided to staff.</li><li><b>Untrained staff:</b> training and standard operating procedures.</li><li><b>Insider threats:</b> access controls, monitoring unusual activity and segregation of duties.</li><li><b>Unpatched applications:</b> install every patch and update.</li><li><b>Third parties</b>, such as a cloud provider: due diligence checks before using them.</li></ul>']
    ],
    terms: [['UK GDPR', 'The UK’s data protection rules, alongside the Data Protection Act 2018.'], ['Personal data', 'Information that identifies a living person.'], ['Special category data', 'Sensitive personal data, such as health, needing extra protection.'], ['ICO', 'The regulator that enforces data protection and can fine.'], ['Computer Misuse Act', 'Makes unauthorised access to computers a crime.'], ['Due diligence', 'Checking a supplier’s security before using them.'], ['Unmanaged device', 'A device the organisation does not control or secure.']],
    quiz: [
      mt('Match each law to what it does.', [['Computer Misuse Act 1990', 'Makes unauthorised access to computers a crime'], ['Data Protection Act 2018', 'Requires personal data to be protected'], ['Investigatory Powers Act 2016', 'Sets powers to obtain communications data'], ['Telecommunications (Security) Act 2021', 'Puts security duties on network providers'], ['Freedom of Information Act 2000', 'Gives access to public bodies’ information']], 'Name the right law in your impacts and policies.'),
      mc('A student guesses a teacher’s password and reads their email. Which law does this break?', 'Computer Misuse Act 1990', ['Freedom of Information Act 2000', 'Human Rights Act 1998', 'Investigatory Powers Act 2016'], 'Unauthorised access to computer material is an offence under the Computer Misuse Act.', 1),
      mc('Which mitigation does spec point 2.11 give for insider threats?', 'Access controls, monitoring and segregation of duties', ['Raising awareness of recent cyber attacks reported in the national news', 'Patching every application as soon as possible', 'Due diligence checks before using suppliers'], 'Insiders already have access, so limit, watch and split it.', 2),
      mc('Which of these is special category data under UK GDPR?', 'A patient’s injury and treatment notes', ['A member’s library card number', 'A café’s opening hours on its website', 'A supplier’s address on an invoice'], 'Health data is special category data, which raises the impact of a breach.', 2),
      mc('Which impact names the law correctly?', 'A breach of the Data Protection Act 2018, which the ICO could fine', ['A GDPR fine handed out by the GDPR company', 'The Computer Misuse Act would fine the library for the leak', 'The Human Rights Act means the library would have to close'], 'The ICO enforces data protection law. GDPR is law, not an organisation.', 2),
      mc('A cloud firm will store the clinic’s patient data. Which mitigation from 2.11 fits?', 'Check the supplier’s security before signing (due diligence)', ['Ask all staff to read the news about recent attacks on other clinics', 'Patch the clinic’s own PCs every single night', 'Give every patient their own Wi-Fi password'], 'Third-party risk is managed by due diligence before you hand over data.', 3)
    ],
    recall: [['Name four laws from 1.21 and what each one does.', ['DPA 2018: protect personal data, detect and limit breaches', 'Computer Misuse Act 1990: unauthorised access and modification are crimes', 'Investigatory Powers Act 2016: powers to obtain communications data', 'Telecommunications (Security) Act 2021: duties on network providers', 'Human Rights Act 1998; Freedom of Information Act 2000']],
      ['Who enforces data protection law, and what can they do?', ['The Information Commissioner’s Office (ICO)', 'Investigate breaches and issue fines']],
      ['Give four threats to privacy and a mitigation for each.', ['Social engineering: awareness', 'Unmanaged devices: policy and secure devices', 'Untrained staff: training and SOPs', 'Insiders: access control, monitoring, segregation of duties', 'Unpatched apps: patching', 'Third parties: due diligence']]],
    apply: [['1a', 'Name the law correctly in your impacts. Health or children’s data raises the impact.', 'Treatment notes exposed: a breach of the Data Protection Act 2018 involving special category data, which the ICO could fine.'], ['1b', 'Privacy mitigations become administrative measures with enforcement methods.', 'Due diligence on the cloud booking firm, recorded before the contract is signed.']] },

  { id: 'cni', title: 'Critical infrastructure, control systems and IoT', ca: 3, spec: ['3.8', '3.9', '3.10'], acts: ['1a', '1b'],
    lede: 'Why attacks on infrastructure affect everyone, what control systems do, and why connected smart devices are a growing risk.',
    figs: [['cni', 'What a cyber incident could do to critical national infrastructure.'], ['iot', 'Weak points in a typical IoT device.']],
    sec: [
      ['Critical national infrastructure', '<p>Attacks here reach far beyond one organisation. <b>Supply chain:</b> food and raw materials stop arriving. <b>Energy:</b> power cuts, surges, under-voltage and loss of gas. <b>Water:</b> no fresh water, flooding and disrupted treatment. <b>Government:</b> national communication channels and policy delivery interrupted. <b>Finance:</b> scheduled payments and transfers fail, and physical payments cannot be processed.</p>'],
      ['Control systems', '<p>Control systems receive data from remote sensors, measure values and control processes or assets across different places. <b>Industrial</b> control systems run critical national infrastructure. <b>Medical</b> ones control life-sustaining equipment and patient data. <b>Facility-related</b> ones control things like door locks. <b>Automotive</b> ones control a vehicle’s engine and fuel systems.</p>'],
      ['Internet of Things (IoT) risks', '<ul><li><b>Poor data protection:</b> little built-in security, often too low-powered for encryption, and connected to shared networks.</li><li><b>Poor passwords:</b> weak or factory default passwords.</li><li><b>Insecure transfer and storage:</b> data not encrypted in processing, transit or at rest.</li><li><b>Weak updates:</b> firmware not validated, updates not delivered securely, no anti-rollback protection, and users not told about security changes.</li></ul>']
    ],
    terms: [['CNI', 'Critical national infrastructure: services a country depends on.'], ['Industrial control system', 'Controls physical processes such as water treatment.'], ['Facility control system', 'Controls building systems such as door locks.'], ['IoT', 'Everyday devices connected to a network.'], ['Firmware', 'Software built into a device.'], ['Anti-rollback', 'Stops a device being put back on older, vulnerable firmware.']],
    quiz: [
      sort('Sort each control system by type.', ['Industrial', 'Medical', 'Facility', 'Automotive'], [['Pump controls at a water treatment plant', 0], ['An infusion pump on a hospital ward', 1], ['Keypad door locks across an office building', 2], ['A car’s engine management system', 3]], 'The four types in 3.9 are told apart by what they control.'),
      mc('Why are many IoT devices hard to secure?', 'They are often too low-powered to support encryption', ['They always use the same fixed IP address', 'They are unable to connect to Wi-Fi networks', 'They are only ever sold to large companies'], 'Limited power and built-in security are the root of many IoT weaknesses.', 1),
      mc('A power surge at a substation is a CNI impact on which sector?', 'Energy', ['Finance', 'Water', 'Government'], 'Power cuts, surges and under-voltage are energy impacts.', 1),
      ms('Select the two IoT update weaknesses from 3.10.', ['Firmware is not validated before installing', 'No anti-rollback protection'], ['Updates always install automatically and safely', 'Devices tell users about every security change'], 'Unchecked firmware and the ability to roll back to old versions both let attackers in.'),
      mc('Which physio clinic risk comes from spec point 3.10?', 'Smart bikes with factory passwords used as a way into the network', ['A patient forgets to log out of the booking website on the reception PC', 'A physiotherapist leaves a door unlocked at lunchtime', 'The card reader at reception is swapped for a fake'], 'Smart bikes are IoT devices. Default passwords are a classic IoT weakness.', 2),
      mc('Why put IoT devices such as a smart TV on their own VLAN?', 'If one is compromised, it cannot reach staff or payment devices', ['IoT devices only work properly when they are placed on a separate VLAN', 'It makes the picture on the TV much clearer', 'VLANs add encryption to IoT devices automatically'], 'Isolation limits what a weak device can lead to.', 2)
    ],
    recall: [['Give four IoT security risks from 3.10.', ['Poor data protection, often no encryption', 'Weak or default passwords', 'Insecure data transfer and storage', 'Weak update processes: unvalidated firmware, no anti-rollback']],
      ['What do control systems do? Name three types.', ['Receive sensor data, measure values, control processes across locations', 'Industrial, medical, facility-related, automotive']],
      ['Describe the impact of a cyber incident on two CNI sectors.', ['Energy: power cuts and surges', 'Water: no fresh water or flooding', 'Finance: failed payments', 'Government or supply chain disruption']]],
    apply: [['1a', 'Smart devices on a floor plan are IoT risks: default passwords, no updates, a flat network.', 'Smart bike 1 still uses its factory password and shares the network with the desk PCs.'], ['1b', 'Answer IoT risks with isolation and hardening.', 'Put the smart bikes and smart TV on their own VLAN and change their default passwords.']] },

  { id: 'terms', title: 'Core terminology and communicating security', ca: 1, spec: ['1.23', '3.7'], acts: ['qoc', '1b', '3'],
    lede: 'The core terms every security professional uses, and the ways security information is shared. Using these terms accurately earns quality of communication marks.',
    figs: [['cia', 'The CIA triad.'], ['iaaa', 'Identification, authentication, authorisation and accountability.'], ['comms', 'Ways of sharing cyber security information.']],
    sec: [
      ['The CIA triad', '<p><b>Confidentiality:</b> only authorised users can access and change data. <b>Integrity:</b> data stays correct, with no unauthorised changes. <b>Availability:</b> authorised users can get to data when they need it.</p>'],
      ['IAAA', '<p><b>Identification:</b> a unique identity such as a username or employee number. <b>Authentication:</b> proving that identity, with single factor or multi-factor authentication (MFA). <b>Authorisation:</b> giving permissions through an access control model. <b>Accountability:</b> actions can be traced back to the person who did them.</p>'],
      ['More core terms', '<p><b>Access control methods</b> restrict or allow access, for example mandatory access control (MAC) or role-based access control (RBAC). <b>Defence in depth</b> layers several security measures so one failing does not leave a system exposed.</p>'],
      ['Sharing security information', '<ul><li><b>Digital services:</b> helpdesk, phone, email, SMS and chat, allowing two-way communication.</li><li><b>Social media:</b> organisational, public, community and personal channels.</li><li><b>Knowledge bases:</b> wikis, the Cyber Security Body of Knowledge (CyBOK), MITRE ATT&amp;CK, blogs, training platforms and vendor updates.</li><li><b>Project management tools:</b> issue logs, Gantt charts, Kanban boards and burndown charts.</li></ul>']
    ],
    terms: [['Confidentiality', 'Only authorised people can access the data.'], ['Integrity', 'Data is not changed without authorisation.'], ['Availability', 'Authorised people can get the data when needed.'], ['Authentication', 'Proving you are who you claim to be.'], ['Authorisation', 'Being given permission to do something.'], ['Accountability', 'Actions can be traced to a person.'], ['MFA', 'Multi-factor authentication: two or more kinds of proof.'], ['Defence in depth', 'Several layers of security, so one failure is not fatal.'], ['MITRE ATT&CK', 'A knowledge base of attackers’ tactics and techniques.']],
    quiz: [
      mt('Match each part of the CIA triad to its meaning.', [['Confidentiality', 'Only authorised users can access the data'], ['Integrity', 'Data is not changed without authorisation'], ['Availability', 'Authorised users can get data when needed']], 'Many requirements protect one part of the triad. Saying which shows understanding.'),
      ord('Put the stages of IAAA in order.', ['Identification', 'Authentication', 'Authorisation', 'Accountability'], 'Say who you are, prove it, get permissions, and your actions are traceable.'),
      mc('A password plus a code from an app is an example of what?', 'Multi-factor authentication', ['Single factor authentication', 'Authorisation', 'Accountability'], 'Two different kinds of proof: something you know and something you have.', 1),
      mc('Which knowledge base maps attackers’ tactics and techniques?', 'MITRE ATT&CK', ['A Gantt chart', 'A burndown chart', 'An issue log'], 'The others are project management tools.', 1),
      mc('Which sentence uses “authorisation” correctly?', 'After logging in, counter staff are authorised to view member records only', ['Staff complete authorisation by typing their username and password at the log-in screen', 'The kiosk authorises a member when it scans their card', 'Authorisation means proving who you are with a password'], 'Typing a password and scanning a card are authentication. Authorisation is what you are then allowed to do.', 2),
      mc('Which requirement shows defence in depth?', 'Guest Wi-Fi on its own VLAN, behind an ACL, with WPA2 and client isolation', ['One very strong, expensive firewall protecting the whole network from the internet', 'A long password on every account in the building', 'A single CCTV camera covering the whole of the lobby'], 'Several independent layers protect the same asset.', 3)
    ],
    recall: [['Explain the CIA triad with an example of each.', ['Confidentiality: only staff can read member records', 'Integrity: records cannot be changed without authorisation', 'Availability: records are there when the counter needs them']],
      ['Explain the four parts of IAAA.', ['Identification: username', 'Authentication: password or MFA', 'Authorisation: permissions', 'Accountability: actions traced to a person']],
      ['Name four ways of sharing cyber security information, with an example of each.', ['Digital services: helpdesk', 'Social media: an organisation’s channel', 'Knowledge bases: MITRE ATT&CK, CyBOK', 'Project tools: issue log, Kanban']]],
    apply: [['qoc', 'Quality of communication rewards these terms used accurately. Authentication and authorisation are the pair most often mixed up.', 'Staff authenticate with MFA; they are then authorised to view member records only.'], ['1b', 'Defence in depth is the idea behind having all three tables in your requirements.', 'VLAN, ACL, WPA2 and client isolation all protect the same guest network.'], ['3', 'Task 3 has no internet, so the vocabulary has to be in your head.', 'My requirements protect availability as well as confidentiality, because the café cannot trade without its reader.']] }
];

FIGS.incidentFlow = () => DIAG.chain(['Identify: service desk, call, email or monitoring tool', 'Log: ticket with contact, date, time and description', 'Categorise and prioritise', 'Investigate and resolve', 'Close, recording any exceptions'], { bw: 320, bh: 40, label: 'The incident process: identify, log, categorise and prioritise, investigate and resolve, then close.' });
